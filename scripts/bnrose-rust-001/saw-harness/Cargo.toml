# the SAW harness crate (the estate's pq02-sponge pattern): standalone,
# depending on the REAL bnrose-replacement-law — the linked MIR carries
# the same single definitions the host's run path calls. No copies, no
# second model.
[package]
name = "bnrose-saw-harness"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BNROSE-SAW-001 harness: links bnrose-replacement-law alone for cargo mir-json."
publish = false

[dependencies]
bnrose-replacement-law = { path = "../../../crates/bnrose-replacement-law" }

# prove the RELEASE semantics: the shipped build has no overflow checks,
# and the u8 wrap corner (255 + 1 -> 0) is a pinned fact of attempt8.
[profile.dev]
overflow-checks = false
[profile.test]
overflow-checks = false

# standalone by declaration (the estate pq02-sponge shape): a crate under
# the workspace tree must not be auto-adopted — cargo saw-build builds it
# alone, with the leaf as its only dependency
[workspace]
