name: WB001 SAW proofs

# bTunGsTeN WB001 on the Rust model itself (crates/btungsten-wb001-core): SAW
# over MIR proves the model equal to the Cryptol spec (EQUIVALENCE), the
# decoder core equal to the decoder spec (DECODE-EQUIVALENCE), proves
# wireInjective for all valid intents (PROVE-UNIVERSAL), runs three TEETH
# obligations that must fail, and checks the RFC 8032 Ed25519 Cryptol spec on
# its closed terms. RB05 then proves the RB04 grammar equal to the decoder
# spec on every input, with RB04's four TEETH substitutions as its controls. Toolchain pins and the mir-json cache are shared with the
# WB002 SAW workflow (same key, same commit, same nightly).

on:
  push:
  pull_request:
  workflow_dispatch:

# SUPERSEDED RUNS (2026-10-15): a newer push to the same branch, or a newer
# head on the same pull request, cancels this workflow's run for the older
# commit, whose result could never gate a merge again (measured that day: 89
# of 192 queued runs repo-wide were for commits no longer any branch's head).
# Main and manual dispatches each get a group of their own, so they are never
# cancelled or folded into another run; the exact head always gets a full run.
# tests.yml and secret-scan.yml are deliberately left out: the §7 identity
# check reads only the commits a push added, so a cancelled push run there
# would let those commits skip detection.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MIR_JSON_REV: 8cbf9af1821075ef47cf784fef78d2650827730d # PUBLIC-CONSTANT: GaloisInc/saw-script v1.6 deps/mir-json submodule commit
  MIR_JSON_TOOLCHAIN: nightly-2026-03-21

jobs:
  saw:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned SAW 1.6 (with bundled solvers)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/saw.tar.gz https://github.com/GaloisInc/saw-script/releases/download/v1.6/saw-1.6-ubuntu-24.04-X64-with-solvers.tar.gz
          echo '0b25c8b32db8b4a7ec32d6700024af60bb2a0398ee350b630dd84ff377c938f7  /tmp/saw.tar.gz' | sha256sum --check # PUBLIC-CONSTANT: upstream release asset digest
          mkdir -p "$HOME/saw" && tar -xzf /tmp/saw.tar.gz -C "$HOME/saw" --strip-components=1
          echo "$HOME/saw/bin" >> "$GITHUB_PATH"
          "$HOME/saw/bin/saw" --version
      - name: Install the mir-json toolchain (${{ env.MIR_JSON_TOOLCHAIN }})
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$MIR_JSON_TOOLCHAIN" --profile minimal --component rustc-dev,rust-src,llvm-tools-preview
      - name: Restore mir-json build (keyed on its commit and toolchain)
        id: mirjson-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # rlibs is ONE symlink into rlibs_real/lib/rustlib/<triple>/lib: caching
          # the link alone restored a dangling pointer (run 37729758258: "can't
          # find crate for `std`"), so the target tree is cached with it and the
          # key is versioned past the broken entry
          path: |
            ~/mir-json-inst
            ~/mir-json/rlibs
            ~/mir-json/rlibs_real
          key: mir-json-v2-${{ env.MIR_JSON_REV }}-${{ env.MIR_JSON_TOOLCHAIN }}-ubuntu-24.04
      - name: Build mir-json at SAW 1.6's pin
        if: steps.mirjson-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/GaloisInc/mir-json.git "$HOME/mir-json"
          cd "$HOME/mir-json"
          git checkout --quiet "$MIR_JSON_REV"
          cargo "+$MIR_JSON_TOOLCHAIN" install --path . --locked --root "$HOME/mir-json-inst"
          PATH="$HOME/mir-json-inst/bin:$PATH" mir-json-translate-libs
      - name: Expose mir-json
        shell: bash
        run: |
          set -euo pipefail
          # a restored cache must carry the translated std, not just a link to it
          [ -f "$HOME/mir-json/rlibs/libstd.rlib" ] || {
            echo "mir-json rlibs missing the translated std after build/restore:"; ls -la "$HOME/mir-json/rlibs" || true; exit 1; }
          echo "$HOME/mir-json-inst/bin" >> "$GITHUB_PATH"
          echo "SAW_RUST_LIBRARY_PATH=$HOME/mir-json/rlibs" >> "$GITHUB_ENV"
          "$HOME/mir-json-inst/bin/mir-json" --version
      - name: WB001 SAW — BUILD + EQUIVALENCE + DECODE-EQUIVALENCE + PROVE-UNIVERSAL + TEETH + Ed25519 SPEC-CHECK
        shell: bash
        run: sh scripts/btungsten/wb001-saw-check.sh saw saw-rustc "$HOME/saw/bin/cryptol"
      - name: RB05 SAW — the RB04 grammar is the WB001 decoder on every input (PROVE-UNIVERSAL + TEETH)
        shell: bash
        run: sh scripts/btungsten/rb05-saw-check.sh saw
