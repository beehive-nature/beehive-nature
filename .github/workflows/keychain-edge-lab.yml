# The keychain edge kit (ops/keys-edge) end to end in throwaway docker on the runner
# (keychain release + edge contract, 2026-10-12, §4 and §6): the keys-door image from its
# Dockerfile on registry-pinned bases, a seq 1 -> seq 2 release chain signed by a throwaway key made
# in the run, keys-door from compose.yml seeded through its inbox, caddy 2.11.4 running
# Caddyfile.keys with only its issuer switched to Caddy's internal CA, OpenSSL 3.5 / curl probes of
# the hybrid-only TLS policy and of every served byte, then rollback and tamper refusals.
# ops/keys-edge/lab/lab.sh holds every step and prints its evidence; any mismatch fails the job.
# No secret, no real key, no public endpoint touched beyond image, package and crate pulls.
name: keychain-edge-lab

on:
  push:
    paths:
      - 'ops/keys-edge/**'
      - 'ops/keys-door/**'
      - 'tools/keychain-release/**'
      - '.github/workflows/keychain-edge-lab.yml'
  pull_request:
    paths:
      - 'ops/keys-edge/**'
      - 'ops/keys-door/**'
      - 'tools/keychain-release/**'
      - '.github/workflows/keychain-edge-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: keys-edge lab, steps a-g (ops/keys-edge/lab/lab.sh)
        env:
          KEYS_EDGE_LAB_DIR: ${{ runner.temp }}/keys-edge-lab
        run: bash ops/keys-edge/lab/lab.sh all
