name: solana-tungsten-local

on:
  push:
    paths:
      - 'tools/solana-tungsten/**'
      - 'scripts/lib/bpay-invoice-generic.mjs'
      - 'scripts/lib/recon-reconcile.mjs'
      - '.github/workflows/solana-tungsten.yml'
  pull_request:
    paths:
      - 'tools/solana-tungsten/**'
      - 'scripts/lib/bpay-invoice-generic.mjs'
      - 'scripts/lib/recon-reconcile.mjs'
      - '.github/workflows/solana-tungsten.yml'

permissions:
  contents: read

jobs:
  local-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, existing estate pin
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # existing estate pin
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path tools/solana-tungsten/Cargo.toml --check
      - name: Boundary acceptance
        run: cargo test --locked --manifest-path tools/solana-tungsten/Cargo.toml
      - name: Lint
        run: cargo clippy --locked --manifest-path tools/solana-tungsten/Cargo.toml --all-targets -- -D warnings
      - name: Existing reconciliation stays open
        run: node tools/solana-tungsten/run.mjs
