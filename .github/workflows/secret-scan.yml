name: secret-scan

# Remote-side backstop for the local pre-commit hook: same shape rules, same
# script (scripts/secret-scan.sh), tree mode. A fresh clone that skipped the
# core.hooksPath setup is detected after push. It is not a pre-publication gate.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan tracked tree for secret-shaped material
        run: sh scripts/secret-scan.sh tree
