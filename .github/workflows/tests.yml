name: tests

# Build + test the whole workspace on Linux runners. This exists for two
# reasons: (1) tests should gate every push, and (2) the Windows dev machine
# runs Smart App Control, which intermittently blocks freshly built unsigned
# test executables (os error 4551) — local verification there is best-effort,
# CI is authoritative.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, reviewed 2026-09-06
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        if: always()
        run: cargo test --workspace --locked
      - name: Check formatting
        if: always()
        run: cargo fmt --all --check
      # the && short-circuit: a gate that cannot print its own failure (cc2, 2026-08-24)
      - name: Shell chain lint
        if: always()
        run: sh scripts/lint-shell-chains.sh
      # AV-11/R5 (2026-09-16): standing future-rail detector — every
      # first-line human payment surface is censused on every push; a
      # surface that asks the human for native gas fails here. Ask-shaped
      # patterns only (educational mentions pass); labeled last-line
      # fallback zones exempt (data-r5-fallback).
      - name: R5 surface audit — no human gas asks
        if: always()
        run: node scripts/r5-surface-audit.mjs
      # bSAFE host lives outside the kernel workspace (own members list + lockfile)
      - name: bSAFE host workspace (THP codec + Noise XX)
        if: always()
        run: cargo test --locked --manifest-path rust/bsafe-host/Cargo.toml
      # x402-door (chartered 2026-09-16): the door laws + acceptance contract.
      # Upstream facilitator-local is Unix-only (tokio::signal::unix) — CI is Linux.
      - name: x402 door (8-point acceptance contract + adversarial battery + live-wiring compile)
        if: always()
        run: |
          cargo test --locked --manifest-path ops/x402-door/Cargo.toml
          cargo build --locked --manifest-path ops/x402-door/Cargo.toml --features live-wiring
      # SPEC-BINDEXER-0: the keyless attestation is a CI-visible receipt
      - name: bindexer keyless attestation (SPEC-BINDEXER-0)
        if: always()
        run: cargo run --locked -p bindexer -- prove-keyless

  static:
    # ORDER (gate seat, 2026-08-24): the four-suite gap — fleet-pixels,
    # fleet-bus, dock-claims and university-smoke were built and
    # mutation-proven but ran on NO push; every assertion this sprint
    # gated nothing. This job carries the suites that need no browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # dock-claims pins a git TREE hash; HEAD must resolve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # SPRINT-2026-08-28 A1: the registry is the single source — every count
      # on the hub computes from estate.json; this proves the registry is
      # internally honest (surfaces once each, states enum, LIVE files exist,
      # counts == recomputed). A hand-written count anywhere fails here.
      - name: Estate registry — counts computed, not written
        if: always()
        run: node scripts/estate-check.mjs
      - name: Front door — search, source parity and accessible art
        if: always()
        run: node --test e2e/atlas.test.mjs e2e/agent-dock.test.mjs e2e/lang-coverage.test.mjs e2e/register.test.mjs e2e/social-arrival.test.mjs e2e/first-click.test.mjs e2e/social-three-view.test.mjs e2e/forge-room-views.test.mjs e2e/kandi-views.test.mjs e2e/kandi-state.test.mjs e2e/kandi-handlers.test.mjs e2e/artist-audio-showcase.test.mjs e2e/artist-audio-collection.test.mjs e2e/artist-audio-player.test.mjs e2e/bearth-views.test.mjs e2e/bsymposium-views.test.mjs e2e/bfood-views.test.mjs e2e/review-views.test.mjs e2e/bigen-views.test.mjs e2e/university-views.test.mjs e2e/onboarding-views.test.mjs e2e/blongevity-views.test.mjs e2e/buzz-directory-views.test.mjs e2e/profile-views.test.mjs e2e/first-work.test.mjs e2e/bloom-work-pack.test.mjs e2e/bnames-rpc.test.mjs e2e/no-dead-host.test.mjs e2e/music-cleanup.test.mjs
      - name: Forge room — pinned Yjs convergence, late join and usable fallback
        if: always()
        working-directory: forge/visual/test
        run: |
          npm ci --ignore-scripts
          node shared.test.mjs
          node core.test.mjs
          node --test room.test.mjs
      - name: Voice worker — bounded queue and child lifetime
        if: always()
        working-directory: ops/voice-scribe
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Box tunnel — renewable lease and scoped shutdown
        if: always()
        run: bash e2e/box-tunnel.test.sh
      - name: Connect Store channel — auth and process-loss recovery
        if: always()
        working-directory: tools/connect-store
        run: |
          npm ci --ignore-scripts
          npm test
          npm run prove
      - name: Recovery inventory — missing dependency + secret-free output
        if: always()
        run: bash e2e/recovery-inventory.test.sh
      - name: Autonomi observations — approved fields and secret canaries
        if: always()
        run: bash docs/runbooks/autonomi-observe.test.sh
      - name: Secret scanner — refused content stays out of logs
        if: always()
        run: bash e2e/secret-scan-output.test.sh
      - name: Identity — PR head range excludes GitHub merge identity
        if: always()
        run: bash e2e/identity-pr-range.test.sh
      # Voucher/escrow engine battery (Seat-1 ledger core, merged 2026-08-29): tithe line,
      # refuse-before-write, derived balances, hash chain, tamper evidence
      - name: Voucher/escrow engine battery (moat ledger core)
        if: always()
        run: python3 scripts/buzz-meter/test_voucher_escrow.py
      # bMAILROOM CANDIDATE battery (zCode seat, 2026-09-19; start order
      # d003de1f + corrections 1e18cbf8/6689f0e1): sink multi-RCPT red-first
      # fix; single-reader ledger (dedupe on (mailbox,digest), crash resume
      # at both points, uncertain-publish retry with stored bytes, hold-
      # then-binding completion, notification/drafting independence);
      # roster single-source vs sink KNOWN; draft-only outbound seam; and
      # the pinned nostr-tools native-notice adapter (signed room metadata,
      # strict DM flags, disabled seam, probe regressions). Node half needs
      # the adapter package (npm ci runs the committed lock).
      - name: bMAILroom candidate battery (sink fix + single reader + draft-only seam)
        if: always()
        run: |
          python3 scripts/buzz-mail/test_sink_multircpt.py
          python3 scripts/buzz-mail/test_mailgate.py
          python3 scripts/buzz-mail/test_notify.py
          python3 scripts/buzz-mail/test_roster.py
          python3 scripts/buzz-mail/test_outbound.py
          python3 scripts/buzz-mail/test_bech32id.py
      - name: bMAILroom native notice adapter (pinned nostr-tools, disabled seam)
        if: always()
        run: |
          npm ci --ignore-scripts --prefix scripts/buzz-mail
          node scripts/buzz-mail/notify-transport.mjs --selftest
          node scripts/buzz-mail/test_notify_transport.mjs
          python3 scripts/buzz-mail/test_notify_adapter_cli.py
      # x402-RAID-Z33 battery (z3.3, 2026-09-04): credit-from-settlement,
      # pause-not-kill, upto ceiling (nonce burn even at zero), lane cost
      # basis + tithe, the 4-state receipt, and the three NAMED halt tests
      # (budget / fraud / infra) — 37 proofs
      - name: x402 meter battery (x402-RAID-Z33)
        if: always()
        run: python3 scripts/buzz-meter/test_x402_meter.py
      # AV-1 serve-bridge battery (zCode, 2026-09-16): meter.py serve under a
      # temp BUZZ_METER_DIR on an ephemeral port — SIGKILL-mid-settle
      # exactly-once, concurrent mixed load (chain + conservation + coherent
      # responses), hostile-input battery (typed 4xx, zero mutation),
      # unknown-response recovery, and the negative control that proves the
      # harness catches a broken idempotency seam
      - name: AV-1 serve-bridge battery (crash/concurrency/hostile)
        if: always()
        run: python3 scripts/buzz-meter/test_serve_bridge.py
      # AV-3 split-brain battery (zCode, 2026-09-16): the meter↔door seam —
      # PART A receipts the pre-fix gap (accrual during outage) forever;
      # 3.1 door-down accrual parks (zero delta, ledger identical,
      # reason=door); 3.2 resume-from-resume-point with zero retroactive
      # backfill; 3.3 credit-out park-not-kill regression-keep; 3.4 the
      # naive-charger negative control is detected
      - name: AV-3 split-brain battery (meter vs delivery door)
        if: always()
        run: python3 scripts/buzz-meter/test_av3_split_brain.py
      # AV-6 retry-storm battery (zCode, 2026-09-16, P1): PART A receipts
      # forever that the 2-consecutive law cannot bound an alternating
      # retry storm; 6.1/6.2 assert the aggregate failure-charge ceiling
      # (inclusive bound, typed loud refusal past it, per-attempt evidence
      # rows kept incl. refused attempts); the unbounded-policy negative
      # control is detected
      - name: AV-6 retry-storm battery (failure-charge ceiling)
        if: always()
        run: python3 scripts/buzz-meter/test_av6_retry_storm.py
      # AV-5 reorg drill (zCode, 2026-09-16, P1): the poller's reorg leg —
      # PART A receipts forever that consumed-seq mutations were skipped
      # silently; 5.1 fork + rollback shapes ⇒ zero credit, evidence-carrying
      # flag, parked watermark, identical ledger bytes; 5.3 the crediting
      # poller detected. The Rust half (reversibility quorum verdicts for
      # the fork) rides cargo test: crates/reversibility/tests/reorg_drill.rs
      - name: AV-5 reorg drill (flag-not-credit)
        if: always()
        run: python3 scripts/buzz-meter/test_av5_reorg_drill.py
      # AV-4 handle unlinkability (zCode, 2026-09-16, P1): PART A receipts
      # forever that the old sequential minter was session-linkable; 4.2
      # proves pure-entropy handles (no lane/timestamp/counter, zero reuse
      # over 10k mints); the sequential minter is detected. The door-side
      # disjointness half rides cargo: ops/x402-door av4_disjointness
      - name: AV-4 handle unlinkability battery
        if: always()
        run: python3 scripts/buzz-meter/test_av4_handle_unlinkability.py
      # AV-11 human-gas surface audit (zCode, 2026-09-16, P1): every rail
      # classified first-line/last-line, every first-line gas surface
      # REGISTERED with its R5 remediation, no stale ledger entries — and
      # the future-rail detector fails on any unregistered human-gas surface
      - name: AV-11 human-gas surface audit
        if: always()
        run: node scripts/audit-human-gas.mjs
      # INVOICE-1 bPay invoice battery (zCode economic seat, 2026-09-17):
      # the generic invoice attacked against the FIRST REFERENCE CONSUMER —
      # zGenealogy's bpay.mjs + skaists.bpay-invoice/1, vendored byte-exact
      # and sha-pinned from lane/zcode-lineage-import @68fdae20. Proves the
      # transportable laws (per-asset separation / receipt-from-evidence-only /
      # measured-states labeling) and registers the generic advance (commitment
      # retrievability offline, evidenced void terminality, content-addressed
      # identity). Registered reds pass and print; pin drift or an unregistered
      # red fails (docs/agents/BPAY-ECONOMIC-LIFECYCLE.md §INVOICE-1)
      - name: INVOICE-1 bPay invoice battery (generic law vs reference consumer)
        if: always()
        run: node scripts/inv1-bpay-invoice.mjs
      # INVOICE-1 builder proof battery (zCode builder lane, 2026-09-17): the
      # generic implementation closes the three registered reds on ITS side —
      # the frozen battery above stays byte-unchanged as the record of the
      # reference's gaps; this proves closure: canonical determinism, content
      # identity, offline commitment re-derivation (incl. the committed
      # attacker with a recomputed digest), evidenced void terminality incl.
      # anchor-caught re-forge + lawful supersession, fresh-process restart
      # with pricing drift, R20/signature fence.
      - name: INVOICE-1 builder proofs (generic implementation)
        if: always()
        run: node scripts/inv1-generic-builder.mjs
      # INVOICE-1 oracle verifier (economic/POS/wallet seat, 2026-09-17):
      # the INDEPENDENT 13-attack re-verification of the generic law — own
      # canonicalization re-derived from the documented set law (quotes are
      # an unordered collection of unique quote identities; raw values
      # sorted before representation). CI-wired only after the formal
      # oracle pass earned 13/13 @801d869f (receipt:
      # docs/dispatches/2026-09-17-invoice1-oracle-reverification-green.md).
      - name: INVOICE-1 oracle verifier (independent 13-attack)
        if: always()
        run: node scripts/inv1-oracle-verify.mjs
      # VOCAB-1 settlement-outcome crosswalk battery (economic seat, 2026-09-17):
      # the naive generic status enum is a REGISTERED RED (information-loss
      # detector fires — normalization must not manufacture certainty); the
      # lossless predicate crosswalk is green; seven founder distinctions as
      # invariants; sabotage negative control proves the detector teeth
      # (docs/agents/VOCAB-1-CROSSWALK.md).
      - name: VOCAB-1 crosswalk battery (lossless outcome predicates)
        if: always()
        run: node scripts/vocab1-crosswalk.mjs
      # RECON-1 obligation-closure battery (economic seat, 2026-09-17):
      # reconciliation DERIVES from evidence and never upgrades the VOCAB-1
      # evidence class; the founder's red-first refusal cases + strongest
      # closure positives + persistence laws (determinism, order-insensitivity,
      # duplicate idempotence); the label-based naive reconciler is the
      # REGISTERED RED comparator (10/10 convicted).
      - name: RECON-1 closure battery (derives, never upgrades evidence)
        if: always()
        run: node scripts/recon1-closure.mjs
      # RECON-1 BUILDER PROOF (zCode builder lane, 2026-09-17): the production
      # primitive scripts/lib/recon-reconcile.mjs proven against the FROZEN
      # closure battery — its case table extracted at runtime from the
      # sha256-pinned frozen bytes (the spec cannot be silently weakened),
      # cross-checked against the frozen inline reference, naive comparator
      # re-convicted through the same harness; mission behaviors (carried-quote
      # owed, fail-closed finality, multi-asset, supersession), human-gesture
      # surface law, persistence through a fresh child process, and source
      # fences (no rail imports, pure derivation).
      - name: RECON-1 primitive builder proof (vs frozen oracle)
        if: always()
        run: node scripts/recon1-primitive.mjs
      # RECON-1 INDEPENDENT ORACLE VERIFIER (economic/oracle seat, 2026-09-17):
      # written against the mission text + frozen oracle bytes ONLY (the
      # builder battery is not imported; its 23/23 is not evidence here).
      # Frozen cases reproduced via the seat's OWN extraction; adversarial
      # lattice A1-A10 (finality fail-closed, class-upgrade dressings,
      # duplicate arithmetic, 24-permutation ordering, restart under
      # mutated/absent pricing, void/supersession matrix, overpay finality,
      # multi-asset no-FX/no-cross-netting, human-gesture SURFACE_MISSING
      # projection with independent tree scan, rail-certainty non-upgrade).
      - name: RECON-1 oracle independent verifier
        if: always()
        run: node scripts/recon1-oracle-verify.mjs
      # Sabotage control: the oracle seat's OWN seductive reconciler
      # (scripts/fixtures/recon1-seductive.mjs — cross-netting, duplicate-
      # counting, finality-blind, refund-manufacturing, SURFACE_READY-
      # claiming) must be CONVICTED on all five named seductions; a green
      # run here would mean the verifier lost its teeth.
      - name: RECON-1 oracle sabotage selftest (teeth)
        if: always()
        run: node scripts/recon1-oracle-verify.mjs --sabotage-selftest
      # bPay MVP Phase A builder selftest (UI seat, 2026-09-17): the quote→
      # invoice mechanical binding — a prepare response for the pinned Bux
      # artifact builds a valid INVOICE-1 invoice (owed derived from the
      # carried quote set, exact ceiling), and REFUSES wrong-artifact sha /
      # wrong byte count / quote-sum mismatch (synthetic selftest fixture,
      # labelled; the real quote receipt is docs/receipts/).
      - name: bPay Phase A — quote→invoice builder selftest (refusal gates)
        if: always()
        run: node scripts/bpay-mvp/invoice-from-quote.mjs --selftest
      # PEER FUNNEL testnet runner selftest (z3.3 Order C, 2026-09-05): the
      # one-broadcast tool cannot rot — keccak + EIP-155 RLP hash vectors and
      # the sign/recover roundtrip proven every push (key parts skip cleanly
      # where no key exists)
      - name: Funnel broadcast selftest (vectors + sign/recover)
        if: always()
        run: node scripts/funnel/broadcast.mjs --selftest
      # estate-source: every data-i18n key in the tree exists in the corpus,
      # every docked tongue covers every key, and the corpus English matches
      # what the pages say (the stale-translation check).
      - name: Language — corpus integrity (estate-source)
        if: always()
        run: node e2e/estate-source.mjs
      # dock-claims re-derives the Dock's three hero numbers from source
      # (chain-zano tree hash, #[ignore] census, STATUS.md sentence) and
      # compares them against what the page prints. Static: node + git only.
      - name: Dock claims — hero numbers re-derived from source
        if: always()
        run: node e2e/dock-claims.mjs
      # §7 hook selftest: a gate's success state is SILENCE — a passing hook
      # and a broken hook look identical. The four cases (seat-author blocked,
      # trailer-in-body blocked, correct shape lands, founder-typed lands) run
      # through the REAL hooks in a throwaway repo every push, so a reintroduced
      # fail-open goes red the same hour. Hook, CI and selftest share ONE
      # implementation — identity-check.sh — never agreeing by convention.
      - name: §7 hook selftest — four cases, every push
        if: always()
        run: sh scripts/identity-check.sh --selftest
      # SPRINT CLOSING RECEIPT (founder order, 2026-08-25): the four-suite gap
      # was work that landed and gated nothing, and a report cannot tell a sprint
      # that shipped from one that stalled. This re-derives every sprint claim
      # from the repo on EVERY push, not at close — a closing gate that first
      # runs at close is a claim about a sprint nobody watched.
      - name: Sprint closing receipt — claims re-derived, not reported
        if: always()
        run: node scripts/sprint-close.mjs docs/dispatches/S26-0825.sprint.json
      # X402 ENGINE PARITY (z3.2, 2026-09-04): the pure 9-check meter audit
      # exists twice by design — the node tool the contract's auditmark pins
      # (contracts/vending/tool/x402audit.mjs) and the browser port on
      # surfaces/vending.html §x402-sec (surfaces/x402-meter.js). This runs
      # BOTH over the session-42 receipt's four demonstrations and fails on
      # any drift in verdict, check name or note bytes — a port that silently
      # disagrees with its tool is a fake verifier wearing the tool's name.
      - name: x402 engine parity — tool and surface agree byte-for-byte
        if: always()
        run: node e2e/x402-engine-parity.mjs
      # THE WORKFLOW ASSERTS ITS OWN SHAPE (zA ruling, 2026-08-24): every
      # suite step carries if:always() or this step fails the run — the
      # next step someone adds cannot reintroduce silent skipping.
      - name: CI shape — every suite step carries if:always()
        if: always()
        run: node scripts/lint-ci-shape.mjs
      # FORGE FREEZE (founder ruling, dispatched 2026-08-24): orbit.html is
      # frozen art — CI fails on ANY edit to its committed blob. The hash is
      # taken from the committed blob, never the worktree copy. Tinkering
      # lives in surfaces/forge/orbit-v2.html (not frozen). LIVES IN STATIC
      # BY RULING: node + git only, no browser deps — a suite red in the
      # node job can never reach this step here.
      - name: Forge freeze — orbit.html committed-blob sha256
        if: always()
        run: node e2e/forge-freeze.mjs
      # §7 DETECTION (not enforcement — actions run after the commits reach
      # origin, so a violation is already public when this step goes red;
      # prevention needs branch protection + PR-only merges, founder's call).
      # The local pre-commit hook is advisory only. THE RANGE IS THE PUSH
      # EVENT'S before..sha — origin/main already points at the pushed sha at
      # checkout time, so origin/main..HEAD is empty BY CONSTRUCTION on push
      # events and would be a no-op dressed as green (founder-caught). New
      # branch (before = all zeros) checks HEAD; anything that cannot be
      # computed FAILS — the check fails closed. LIVES IN STATIC BY RULING;
      # the full-history checkout this job already carries (for dock-claims'
      # tree pin) is exactly what the range check needs.
      # A PR checkout is GitHub's synthetic merge, whose author is not the
      # contributing seat. Check the real base..head commits, retaining the
      # same founder-author/trailer rules and fail-closed ref resolution.
      - name: §7 identity — author is the founder on the contributed range
        if: always()
        env:
          S7_BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          S7_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/identity-check.sh

  node:
    # latent hardening (z3.2, 2026-09-03): this job's whole history is 3–15 min
    # (worst = cold npm/Playwright install); a 20-min cap bounds any future
    # real hang at a third of the runner's 6h default, so a wedged battery can
    # never again sit unnoticed for hours. No battery misbehaves today — this
    # is the cap, not a fix.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # Full history: the §7 pushed-range check needs origin/main..HEAD
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # The 26 include the pinned cross-implementation vector any Rust port
      # must reproduce byte-identically (prf 0x01×32 → master_prk d54134a6…).
      - name: Key-build engine unit tests (26, incl. pinned vector)
        if: always()
        working-directory: key-build/bdid-key
        run: |
          npm ci
          node test/test.mjs
      # ORDER note: university-smoke was classified "static" in the gate
      # order; measured fact — it launches Chromium (playwright import),
      # so it lives in THIS job after the browser install. Classification
      # corrected in wiring, not assumed.
      # Chromium is PINNED by the lockfile: npm ci installs the exact
      # playwright the repo pins; `playwright install chromium` then
      # fetches that version's browser build. Both numbers print below —
      # the pin is the receipt, not a claim.
      # SHARED SETUP, deliberately split out (zA class fix): install once,
      # then every suite step carries if:always(). When SETUP fails, the
      # always() suites still FIRE and fail noisily on the missing
      # dependency — visible and attributable, never skipped. The only
      # exempt step in the workflow; lint-ci-shape.mjs knows its name.
      - name: shared setup — install (exempt from always())
        working-directory: e2e
        run: |
          npm ci
          npx playwright --version
          npx playwright install --dry-run chromium
          npx playwright install --with-deps chromium
      # W@tch and PLUR consume the same language-neutral manifest. These
      # browser proofs keep the adapter read-only: no relay, x0x, wallet,
      # Autonomi write, or Trezor approval is opened by either surface.
      # plur-views proves the three register experiences, the optional
      # pronunciation example (labelled, no autoplay, honestly disabled
      # without voices) and the tutor's honest unavailable state; all
      # external requests are intercepted and never delivered.
      - name: W@tch + PLUR manifest adapters — read-only browser proofs
        if: always()
        run: |
          node e2e/plur-views.mjs
          node e2e/zcode-music-check.mjs
          node e2e/zcode-music-store-reader-check.mjs
          node e2e/zcode-music-views-check.mjs
          node e2e/zcode-watch-manifest-check.mjs
      - name: Reading rooms — first actions, view retention and translated layouts
        if: always()
        working-directory: e2e
        run: node reading-rooms.browser.mjs
      - name: Kandi — gift reliability and failure recovery
        if: always()
        working-directory: e2e
        run: node kandi-gift.mjs
      - name: Kandi — arm placement and legacy migration
        if: always()
        working-directory: e2e
        run: node kandi-arms.mjs
      - name: Kandi — two local handoffs
        if: always()
        working-directory: e2e
        run: node kandi-crossing.mjs
      - name: Kandi — preview and explicit keep
        if: always()
        working-directory: e2e
        run: node kandi-arrival.mjs
      - name: Kandi — bead composition
        if: always()
        working-directory: e2e
        run: node kandi-thread.mjs
      # bPay Phase A gate (UI seat, 2026-09-17): the REAL machine-bound
      # invoice renders in the wallet surface — identity (name/bytes/sha256),
      # owed recomputed from the carried quote set by the TEST, native gas
      # separate, freshness, commitment, honest waiting state — and the page
