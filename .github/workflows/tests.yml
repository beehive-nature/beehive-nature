name: tests

# Build + test the whole workspace on Linux runners. This exists for two
# reasons: (1) tests should gate every push, and (2) the Windows dev machine
# runs Smart App Control, which intermittently blocks freshly built unsigned
# test executables (os error 4551) — local verification there is best-effort,
# CI is authoritative.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        if: always()
        run: cargo test --workspace --locked
      - name: Check formatting
        if: always()
        run: cargo fmt --all --check
      # the && short-circuit: a gate that cannot print its own failure (cc2, 2026-08-24)
      - name: Shell chain lint
        if: always()
        run: sh scripts/lint-shell-chains.sh
      # bSAFE host lives outside the kernel workspace (own members list + lockfile)
      - name: bSAFE host workspace (THP codec + Noise XX)
        if: always()
        run: cargo test --locked --manifest-path rust/bsafe-host/Cargo.toml
      # SPEC-BINDEXER-0: the keyless attestation is a CI-visible receipt
      - name: bindexer keyless attestation (SPEC-BINDEXER-0)
        if: always()
        run: cargo run --locked -p bindexer -- prove-keyless

  static:
    # ORDER (gate seat, 2026-08-24): the four-suite gap — fleet-pixels,
    # fleet-bus, dock-claims and university-smoke were built and
    # mutation-proven but ran on NO push; every assertion this sprint
    # gated nothing. This job carries the suites that need no browser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # dock-claims pins a git TREE hash; HEAD must resolve
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # SPRINT-2026-08-28 A1: the registry is the single source — every count
      # on the hub computes from estate.json; this proves the registry is
      # internally honest (surfaces once each, states enum, LIVE files exist,
      # counts == recomputed). A hand-written count anywhere fails here.
      - name: Estate registry — counts computed, not written
        if: always()
        run: node scripts/estate-check.mjs
      # Voucher/escrow engine battery (Seat-1 ledger core, merged 2026-08-29): tithe line,
      # refuse-before-write, derived balances, hash chain, tamper evidence
      - name: Voucher/escrow engine battery (moat ledger core)
        if: always()
        run: python3 scripts/buzz-meter/test_voucher_escrow.py
      # estate-source: every data-i18n key in the tree exists in the corpus,
      # every docked tongue covers every key, and the corpus English matches
      # what the pages say (the stale-translation check).
      - name: Language — corpus integrity (estate-source)
        if: always()
        run: node e2e/estate-source.mjs
      # dock-claims re-derives the Dock's three hero numbers from source
      # (chain-zano tree hash, #[ignore] census, STATUS.md sentence) and
      # compares them against what the page prints. Static: node + git only.
      - name: Dock claims — hero numbers re-derived from source
        if: always()
        run: node e2e/dock-claims.mjs
      # §7 hook selftest: a gate's success state is SILENCE — a passing hook
      # and a broken hook look identical. The four cases (seat-author blocked,
      # trailer-in-body blocked, correct shape lands, founder-typed lands) run
      # through the REAL hooks in a throwaway repo every push, so a reintroduced
      # fail-open goes red the same hour. Hook, CI and selftest share ONE
      # implementation — identity-check.sh — never agreeing by convention.
      - name: §7 hook selftest — four cases, every push
        if: always()
        run: sh scripts/identity-check.sh --selftest
      # SPRINT CLOSING RECEIPT (founder order, 2026-08-25): the four-suite gap
      # was work that landed and gated nothing, and a report cannot tell a sprint
      # that shipped from one that stalled. This re-derives every sprint claim
      # from the repo on EVERY push, not at close — a closing gate that first
      # runs at close is a claim about a sprint nobody watched.
      - name: Sprint closing receipt — claims re-derived, not reported
        if: always()
        run: node scripts/sprint-close.mjs docs/dispatches/S26-0825.sprint.json
      # X402 ENGINE PARITY (z3.2, 2026-09-04): the pure 9-check meter audit
      # exists twice by design — the node tool the contract's auditmark pins
      # (contracts/vending/tool/x402audit.mjs) and the browser port on
      # surfaces/vending.html §x402-sec (surfaces/x402-meter.js). This runs
      # BOTH over the session-42 receipt's four demonstrations and fails on
      # any drift in verdict, check name or note bytes — a port that silently
      # disagrees with its tool is a fake verifier wearing the tool's name.
      - name: x402 engine parity — tool and surface agree byte-for-byte
        if: always()
        run: node e2e/x402-engine-parity.mjs
      # THE WORKFLOW ASSERTS ITS OWN SHAPE (zA ruling, 2026-08-24): every
      # suite step carries if:always() or this step fails the run — the
      # next step someone adds cannot reintroduce silent skipping.
      - name: CI shape — every suite step carries if:always()
        if: always()
        run: node scripts/lint-ci-shape.mjs
      # FORGE FREEZE (founder ruling, dispatched 2026-08-24): orbit.html is
      # frozen art — CI fails on ANY edit to its committed blob. The hash is
      # taken from the committed blob, never the worktree copy. Tinkering
      # lives in surfaces/forge/orbit-v2.html (not frozen). LIVES IN STATIC
      # BY RULING: node + git only, no browser deps — a suite red in the
      # node job can never reach this step here.
      - name: Forge freeze — orbit.html committed-blob sha256
        if: always()
        run: node e2e/forge-freeze.mjs
      # §7 DETECTION (not enforcement — actions run after the commits reach
      # origin, so a violation is already public when this step goes red;
      # prevention needs branch protection + PR-only merges, founder's call).
      # The local pre-commit hook is advisory only. THE RANGE IS THE PUSH
      # EVENT'S before..sha — origin/main already points at the pushed sha at
      # checkout time, so origin/main..HEAD is empty BY CONSTRUCTION on push
      # events and would be a no-op dressed as green (founder-caught). New
      # branch (before = all zeros) checks HEAD; anything that cannot be
      # computed FAILS — the check fails closed. LIVES IN STATIC BY RULING;
      # the full-history checkout this job already carries (for dock-claims'
      # tree pin) is exactly what the range check needs.
      - name: §7 identity — author is the founder on the pushed range
        if: always()
        env:
          S7_BEFORE: ${{ github.event.before }}
          S7_SHA: ${{ github.sha }}
        run: sh scripts/identity-check.sh

  node:
    # latent hardening (z3.2, 2026-09-03): this job's whole history is 3–15 min
    # (worst = cold npm/Playwright install); a 20-min cap bounds any future
    # real hang at a third of the runner's 6h default, so a wedged battery can
    # never again sit unnoticed for hours. No battery misbehaves today — this
    # is the cap, not a fix.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # Full history: the §7 pushed-range check needs origin/main..HEAD
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The 26 include the pinned cross-implementation vector any Rust port
      # must reproduce byte-identically (prf 0x01×32 → master_prk d54134a6…).
      - name: Key-build engine unit tests (26, incl. pinned vector)
        if: always()
        working-directory: key-build/bdid-key
        run: |
          npm ci
          node test/test.mjs
      # ORDER note: university-smoke was classified "static" in the gate
      # order; measured fact — it launches Chromium (playwright import),
      # so it lives in THIS job after the browser install. Classification
      # corrected in wiring, not assumed.
      # Chromium is PINNED by the lockfile: npm ci installs the exact
      # playwright the repo pins; `playwright install chromium` then
      # fetches that version's browser build. Both numbers print below —
      # the pin is the receipt, not a claim.
      # SHARED SETUP, deliberately split out (zA class fix): install once,
      # then every suite step carries if:always(). When SETUP fails, the
      # always() suites still FIRE and fail noisily on the missing
      # dependency — visible and attributable, never skipped. The only
      # exempt step in the workflow; lint-ci-shape.mjs knows its name.
      - name: shared setup — install (exempt from always())
        working-directory: e2e
        run: |
          npm ci
          npx playwright --version
          npx playwright install --dry-run chromium
          npx playwright install --with-deps chromium
      - name: Onboarding e2e (Chromium + virtual authenticator w/ PRF)
        if: always()
        working-directory: e2e
        run: node e2e.mjs
      - name: University smoke (browser suite — see Chromium note above)
        working-directory: e2e
        if: always()   # a sibling suite's red must not SKIP this one — every
                       # suite fires every run, or a red stops being attributable
        run: node university-smoke.mjs
      - name: No page errors anywhere (the helper-missing gate — the T_ class)
        if: always()
        working-directory: e2e
        run: node no-page-errors.mjs
      # the language lane (2026-08-28), browser-side like every playwright
      # suite: first the checker-silence proof — the coverage instrument must
      # count a keyed string AND an unkeyed string through the same path
      # before it reports anything; then the measure on the arrival set
      # (four redesigned + seven doors + one tap from each door) with the
      # floors ratchet — keyed% may never regress below the recorded line.
      # The 240-key deep backlog stays a recorded number, not a demand:
      # floors hold, they never require.
      - name: Language — coverage gate selftest (checker-silence law)
        if: always()
        working-directory: e2e
        run: node i18n-coverage.mjs --selftest
      - name: Language — coverage measure on the arrival set, floors enforced
        if: always()
        working-directory: e2e
        run: node i18n-coverage.mjs --set lang-coverage-set.json ru --floors
      # fleet-pixels: every chart-bearing hosted surface must DRAW (pixels
      # read back from the canvas, not merely load). fleet-bus: the
      # localStorage data bus asserted both directions (same origin reads;
      # cross origin severs silently). Both run against surfaces/fleet-hosted,
      # repo-relative; the originals under surfaces/fleet/ are never touched.
      - name: Fleet pixels — the art draws, not just loads
        working-directory: e2e
        if: always()
        run: node fleet-pixels.mjs
      - name: Fleet bus — the localStorage bus, both directions
        working-directory: e2e
        if: always()
        run: node fleet-bus.mjs
      # THE JOB MOVE (zA completion ruling, 2026-08-24): the two DETECTION
      # steps moved INTO STATIC, out of this suite job — structural immunity.
      # Annotation (if:always()) is something the next person must remember;
      # a job a suite red cannot reach is something they cannot forget.
      # Their new home: the static job, below, with the same comments.
