[package]
name = "bsigner-recovery"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# Deliberately isolated: no modification of the signer's workspace lockfile.
[workspace]

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
toml = "=1.1.8"

[profile.release]
strip = true
