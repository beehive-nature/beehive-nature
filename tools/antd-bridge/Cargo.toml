[package]
name = "antd-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
ant-core = { git = "https://github.com/WithAutonomi/ant-client.git" }
ant-protocol = "2.4.0"
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
