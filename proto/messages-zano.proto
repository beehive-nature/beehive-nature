//   A. Exact serialization of the balance proof double-Schnorr. [zarcanum.cpp]
//   B. Multi-asset context fields for Confidential Assets (v2+). Native-only
//      v1 uses the single explicit-asset path. [tx-builder]
//   (OUT OF BAND) tx_prefix_hash must be byte-identical to the daemon —
//   vector-tested. The v4 prefix layout the bytes follow is DOCUMENTED in
//   this file at ZanoSignInput.tx_prefix_hash (v0.4); what stays out of
//   band is only the vector set itself, generated from v4 prefixes.
//
// CLOSED in v0.4: the out-of-band contract's INPUT is now defined at source
//   (v4 prefix layout, every byte cited); the intrinsic encrypted_payment_id
