# jungle4-node.config.ini — the ZK/Vaulta lane's Jungle4 FOLLOWER node
# (zCode seat, founder-supplied peer set 2026-10-06; posture hardened
# founder+review 2026-10-07: explicit loopback P2P bind + net_api_plugin).
#
# LAW (founder, with the peer set): this list is CONFIGURATION, not
# evidence. Peer availability is transient. Anything this lane receipts
# about Jungle4 connectivity must come from the node's OWN view at test
# time — `curl http://127.0.0.1:8888/v1/net/connections` filtered to
# peers in a connected state, timestamped — never from this file.
# (SPEC-RECEIPT-OBSERVABILITY-1: the receipt derives from measured state.)
#
# LAW (founder, 2026-10-07, scope-corrected same day per review):
#   **Configuration intent is never runtime evidence.**
#
#   `EXPOSURE → IDENTITY → PEER → AGREEMENT` governs admission of this
#   follower as a verification source for Jungle4 ZK execution. No
#   downstream receipt may attribute independent Jungle4 verification to
#   this follower until those runtime checks pass.
#
#   Offline proving and proof verification remain independent.
#   Public-API submissions follow their own execution-evidence path and
#   must not borrow verification status from the configured or
#   unsynchronized follower.
#
#   (Supersedes the earlier broader phrasing — "nothing cryptographic
#   may inherit Jungle4 / only then ZK interaction" — which read as
#   gating every cryptographic operation everywhere; the gate admits
#   THIS FOLLOWER as a verification source, nothing more.)
#
# THE RULE, PRECISELY:
#   no follower-derived trust before follower agreement;
#   no execution claim without execution evidence;
#   no configuration value promoted into either.
#
# FIRST-BOOT GATE — ONE SHOT PER TESTED RUNTIME INSTANCE, not a
# permanently green property. Each run's receipts bind to: process/run
# identity, nodeos binary identity, this configuration's identity, and
# the data directory — with observation times. A restart, a config or
# build change, or a new data dir must NOT silently inherit an earlier
# EXPOSURE/IDENTITY/PEER/AGREEMENT result; a peer count is a
# timestamped observation, never a permanent property.
#   EXPOSURE → IDENTITY → PEER → AGREEMENT.
# Boot once; collect all four receipts; classify any RED precisely; a
# zero-handshake boot is itself evidence (peer compatibility, endpoint
# reachability, protocol/version mismatch, NAT behavior, or this node
# build's allowed-connection semantics) — record the observed failure
# and investigate WITHOUT declaring a cause prematurely and WITHOUT
# silently weakening `allowed-connection = none`.
# STATUS: all four boot receipts are NOT RUN — this file establishes
# the intended configuration and receipt requirements only; the
# executing lane produces the receipts.
#
# POSTURE — EXPLICIT, not implied by omission: Antelope net_plugin
# DEFAULTS p2p-listen-endpoint to 0.0.0.0:9876, so leaving it unset is
# NOT outbound-only. Two boundaries instead of one:
#   1. p2p-listen-endpoint = 127.0.0.1:9876  — the socket never leaves
#      loopback, whatever the policy says;
#   2. allowed-connection = none             — the node accepts no
#      inbound connection requests; the p2p-peer-address entries below
#      still provide the outbound sync path. If ZERO peers complete a
#      Jungle4 handshake under this posture, that is a FINDING to
#      receipt and diagnose, not a config to quietly relax.
# HTTP stays on 127.0.0.1:8888: net_api_plugin also exposes
# connect/disconnect controls and must not be public.
#
# SHAPE: NON-PRODUCING follower, outbound-only from outside the machine.
# The rehearsal dev chain (-e -p eosio, own genesis, /tmp/nd) is a
# DIFFERENT chain and cannot merge with these peers — different chain-id
# means refused handshakes. This node syncs Jungle4 state and serves
# local cleos/RPC. TWO EVIDENCE PATHS, DISTINCT — neither automatically
# establishes the other:
#   · follower-backed: the four boot receipts above (what this process
#     exposed, which chain it identified, which peers completed
#     handshakes, whether its block identity agrees with the comparison
#     source at an exact height + block ID);
#   · public-API: every test artifact labels its trust domains —
#       submission_source   = <public API X>
#       execution block     = N / <block id>
#       verification_source = <local follower | public API Y>
#     — alongside the transaction ID, the EXACT deployed-code identity,
#     and the ASSERTED execution effects. A successful response alone
#     is insufficient (the recorded codeless-deployment incident:
#     actions APPEARED to execute while no verifier code was present).
# A public-testnet execution receipt need not wait for this follower;
# this follower must not claim it independently confirmed that
# execution before its own agreement evidence exists.
#
# FIRST BOOT — four separate receipts, none collapsed into "synced";
# each names its per-instance bindings (run, binary, config, data dir,
# observation time). Loopback-BOUND is not CLOSED: the EXPOSURE
# acceptance condition is that the OBSERVED listeners match the
# INTENDED posture (HTTP + P2P bound to loopback) — not that the
# process has no listening sockets:
#   1. EXPOSURE  — actual runtime socket bindings (ss -ltnp); config
#                  intent is not the receipt; the bound sockets are.
#   2. IDENTITY  — local /v1/chain/get_info: chain_id, head, LIB,
#                  server version, timestamp. The configured
#                  73e4385a…716c4d stays EXPECTED/UNVERIFIED until
#                  this lands.
#   3. PEER      — local /v1/net/connections, timestamped; configured
#                  nine ≠ connected nine; only completed Jungle4
#                  handshakes count.
#   4. AGREEMENT — names the EXACT compared height AND block ID: the
#                  local LIB block number's exact block ID checked
#                  against an independent public Jungle4 API — matching
#                  chain_id + matching block ID at the same height,
#                  never merely "head numbers look close".
# All four: NOT RUN at this file's revision.
# The chain this node must speak:
#   chain-id = 73e4385a2708e6d7048834fbc1079f2fabb17b3c125b146af438971e90716c4d  # PUBLIC-CONSTANT: Jungle4 (Vaulta testnet) chain id, read from its API 2026-10-06
# UNVERIFIED until receipt 2 (and then receipt 4) lands.

# plugins: chain + API, http (loopback), net + net_api (the peer-receipt
# endpoint /v1/net/connections lives in net_api_plugin)
plugin = eosio::chain_plugin
plugin = eosio::chain_api_plugin
plugin = eosio::http_plugin
plugin = eosio::net_plugin
plugin = eosio::net_api_plugin
http-server-address = 127.0.0.1:8888

# follower posture: outbound peers only, from outside the machine
p2p-listen-endpoint = 127.0.0.1:9876
allowed-connection = none

# the founder-supplied peer set — kept verbatim, all nine, mixed
# DNS/IP and port shapes as given (2026-10-06)
p2p-peer-address = jungle4.cryptolions.io:9870
p2p-peer-address = peer.jungle4.alohaeos.com:9876
p2p-peer-address = jungle4.eosphere.io:9876
p2p-peer-address = jungle4.seed.eosnation.io:9876
p2p-peer-address = p2p.jungle.detroitledger.tech:1337
p2p-peer-address = jungletestnet.eos3.app:9876
p2p-peer-address = 148.113.20.240:9877
p2p-peer-address = 64.204.204.158:9876
p2p-peer-address = jungletestnet.eospanshi.com:9876
