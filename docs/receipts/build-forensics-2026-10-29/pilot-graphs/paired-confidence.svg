<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="345" viewBox="0 0 1100 345" role="img"><title>Paired time saved by the Rust controller</title><rect width="1100" height="345" fill="#f4f7fc"/><g font-family="Arial,sans-serif" fill="#152139"><text x="28" y="35" font-size="23" font-weight="bold">Time saved per invocation, with uncertainty</text><text x="28" y="61" font-size="14">Point = mean paired saving; line = 95% paired bootstrap interval; 30 pairs; one host</text><path d="M340 90V275H1000" stroke="#52637b" fill="none"/><text x="335" y="298" font-size="12">0 ms</text><text x="28" y="130" font-size="15">Python inventory → Rust</text><path d="M413.92371407148937 125H439.4623649262639" stroke="#126b65" stroke-width="5"/><circle cx="424.6770268786584" cy="125" r="7" fill="#126b65"/><text x="340" y="155" font-size="13">267.0 ms saved; 95% CI 233.1–313.6 ms; p ≈ 0.00010</text><text x="28" y="230" font-size="15">Shell/Node law gate → Rust</text><path d="M858.1186425590561 225H960" stroke="#126b65" stroke-width="5"/><circle cx="906.8924537827288" cy="225" r="7" fill="#126b65"/><text x="340" y="255" font-size="13">1787.2 ms saved; 95% CI 1633.4–1954.6 ms; p ≈ 0.00010</text><text x="930" y="298" font-size="12">1955 ms</text><text x="28" y="330" font-size="12">Local implementation measurements; no language-wide or cryptographic performance claim.</text></g></svg>