<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="345" viewBox="0 0 1100 345" role="img"><title>Paired controller time difference</title><rect width="1100" height="345" fill="#f4f7fc"/><g font-family="Arial,sans-serif" fill="#152139"><text x="28" y="35" font-size="23" font-weight="bold">Time difference per invocation, with uncertainty</text><text x="28" y="61" font-size="14">Historical minus Rust: positive favors Rust. Point = mean; line = 95% bootstrap interval; 30 pairs.</text><path d="M340 275H1000" stroke="#52637b" fill="none"/><path d="M340 90V275" stroke="#52637b" stroke-dasharray="4 4"/><text x="335" y="298" font-size="12">0 ms</text><text x="28" y="130" font-size="15">Python inventory → Rust</text><path d="M360.4917861055818 125H363.256648790533" stroke="#126b65" stroke-width="5"/><circle cx="361.7989645211582" cy="125" r="7" fill="#126b65"/><text x="340" y="155" font-size="13">Difference 62.9 ms; 95% CI [59.1, 67.1] ms; p = 0.00010</text><text x="28" y="230" font-size="15">Shell/Node law gate → Rust</text><path d="M858.1019916870722 225H960" stroke="#126b65" stroke-width="5"/><circle cx="901.3368046917295" cy="225" r="7" fill="#126b65"/><text x="340" y="255" font-size="13">Difference 1619.8 ms; 95% CI [1495.1, 1789.1] ms; p = 0.00010</text><text x="930" y="298" font-size="12">1789 ms</text><text x="28" y="330" font-size="12">Local implementation measurements; no language-wide or cryptographic performance claim.</text></g></svg>