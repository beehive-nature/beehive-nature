<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img"><title>Integrity controls on preserved Python and native Rust</title><rect width="1100" height="510" fill="#f4f7fc"/><g font-family="Arial,sans-serif" fill="#152139"><text x="28" y="35" font-size="23" font-weight="bold">Two missing controls in the preserved Python implementation</text><text x="28" y="61" font-size="14">Deterministic test cases; these are not a language vulnerability rate or a security proof.</text><text x="520" y="95" font-size="15">Preserved Python</text><text x="790" y="95" font-size="15">Native Rust</text><text x="28" y="132" font-size="14">clean</text><rect x="520" y="115" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="133" font-size="13" fill="white">clean accepted (exit 0)</text><rect x="790" y="115" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="133" font-size="13" fill="white">clean accepted (exit 0)</text><text x="28" y="168" font-size="14">changed-byte</text><rect x="520" y="151" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="169" font-size="13" fill="white">change rejected (exit 1)</text><rect x="790" y="151" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="169" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="204" font-size="14">extra-file</text><rect x="520" y="187" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="205" font-size="13" fill="white">change rejected (exit 1)</text><rect x="790" y="187" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="205" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="240" font-size="14">missing-file</text><rect x="520" y="223" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="241" font-size="13" fill="white">change rejected (exit 1)</text><rect x="790" y="223" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="241" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="276" font-size="14">changed-mode</text><rect x="520" y="259" width="205" height="26" rx="3" fill="#a63327"/><text x="530" y="277" font-size="13" fill="white">change accepted (exit 0)</text><rect x="790" y="259" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="277" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="312" font-size="14">manifest-and-content-replaced</text><rect x="520" y="295" width="205" height="26" rx="3" fill="#a63327"/><text x="530" y="313" font-size="13" fill="white">change accepted (exit 0)</text><rect x="790" y="295" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="313" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="348" font-size="14">duplicate-path</text><rect x="520" y="331" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="349" font-size="13" fill="white">change rejected (exit 1)</text><rect x="790" y="331" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="349" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="384" font-size="14">parent-traversal</text><rect x="520" y="367" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="385" font-size="13" fill="white">change rejected (exit 1)</text><rect x="790" y="367" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="385" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="420" font-size="14">invalid-json</text><rect x="520" y="403" width="205" height="26" rx="3" fill="#126b65"/><text x="530" y="421" font-size="13" fill="white">change rejected (exit 1)</text><rect x="790" y="403" width="205" height="26" rx="3" fill="#126b65"/><text x="800" y="421" font-size="13" fill="white">change rejected (exit 1)</text><text x="28" y="465" font-size="13">The Rust port adds independent manifest anchoring and mode checks. Python can implement both.</text><text x="28" y="488" font-size="13">Manifest edits are stopped at the Rust anchor; this table does not prove all downstream parser paths.</text></g></svg>