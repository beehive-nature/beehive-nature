<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="222" viewBox="0 0 1100 222" role="img"><title>A documented bottleneck: waiting before execution</title><desc>One selected historical wallet job; this is a case study, not a repository-wide average</desc><rect width="1100" height="222" fill="#f4f7fc"/><g font-family="Arial,sans-serif" fill="#152139"><text x="28" y="35" font-size="23" font-weight="bold">A documented bottleneck: waiting before execution</text><text x="28" y="60" font-size="14">One selected historical wallet job; this is a case study, not a repository-wide average</text><rect x="28" y="78" width="14" height="14" fill="#b86521"/><text x="49" y="90" font-size="13">Workflow creation to job start</text><rect x="360" y="78" width="14" height="14" fill="#126b65"/><text x="381" y="90" font-size="13">Job execution</text><text x="28" y="131" font-size="14">Oct 17 wallet job</text><rect x="340" y="115" width="469.89" height="23" fill="#b86521"/><rect x="809.8904340497261" y="115" width="110.11" height="23" fill="#126b65"/><text x="340" y="156" font-size="12">128.17 + 30.03 minutes</text><text x="340" y="214" font-size="12">Linear scale from zero; maximum stacked length = 158.20 minutes</text></g></svg>