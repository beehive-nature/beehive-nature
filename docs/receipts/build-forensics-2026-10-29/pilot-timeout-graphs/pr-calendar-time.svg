<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="284" viewBox="0 0 1100 284" role="img"><title>How long did merged pull requests stay open?</title><desc>Calendar time includes development, review and CI; unresolved PRs are counted in the data</desc><rect width="1100" height="284" fill="#f4f7fc"/><g font-family="Arial,sans-serif" fill="#152139"><text x="28" y="35" font-size="23" font-weight="bold">How long did merged pull requests stay open?</text><text x="28" y="60" font-size="14">Calendar time includes development, review and CI; unresolved PRs are counted in the data</text><rect x="28" y="78" width="14" height="14" fill="#b86521"/><text x="49" y="90" font-size="13">Median open-to-merge hours</text><rect x="360" y="78" width="14" height="14" fill="#126b65"/><text x="381" y="90" font-size="13"></text><text x="28" y="131" font-size="14">2026-09: 210 merged / 269 opened</text><rect x="340" y="115" width="224.06" height="23" fill="#b86521"/><rect x="564.0594489043176" y="115" width="0.00" height="23" fill="#126b65"/><text x="340" y="156" font-size="12">0.49 + 0.00 hours</text><text x="28" y="193" font-size="14">2026-10: 186 merged / 206 opened</text><rect x="340" y="177" width="580.00" height="23" fill="#b86521"/><rect x="920" y="177" width="0.00" height="23" fill="#126b65"/><text x="340" y="218" font-size="12">1.28 + 0.00 hours</text><text x="340" y="276" font-size="12">Linear scale from zero; maximum stacked length = 1.28 hours</text></g></svg>