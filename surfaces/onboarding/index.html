<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BNR · Get started</title>
<!--
  BNR ONBOARDING WIZARD — beta-test preview.
  Self-contained, ZERO network (tokens inlined, system fonts, no fetch) so it runs
  offline / at festival-mesh scale and opens from file:// on any device.

  Design: docs/tokens.css (embedded verbatim) + DESIGN-BRIEF-01 gauge law.
  Ladder: the 8e FULL SURFACE — every custody option that passes the
    10^10 / 1000yr / offline-mesh filter is offered, none elected (founder ruling
    2026-08-14). Passkey · optical air-gap (free hardware custody, decimen) ·
    security key · Trezor — climb anytime, identity never changes.
  Patterns: authentik flows/stages (RAID_AUTHENTIK_IDP_PATTERNS) — one screen per
    stage, re-entrant remediation, confirm-before-activate recovery, designation.
  Preview note: auth steps SIMULATE in a sandbox; real WebAuthn/optical/USB when
    served from wallet-relay. The self-funded model shows a ZERO balance at the end
    ("earn b through participation") — never a fake starter balance.
-->
<style>
/* ==== docs/tokens.css (embedded verbatim — source of law) ==== */
:root{color-scheme:dark light;--flow:90deg;--hatch:45deg;
--ai:#45C2DC;--ai-deep:#57CDE4;--biomass:#86CC72;--sovereign:#9C6FD6;--sovereign-soft:#B79FE0;--you:#D655BB;
--rainbow:linear-gradient(var(--flow),#FBFB9F,#86CC72,#45C2DC,#6FA9E0,#9C6FD6);
--primary:var(--you);--info:#6FA9E0;--verified:var(--biomass);--guard:#B7A8F7;--b-value:#E8B54B;
--bg:#06110C;--bg-card:#0C1412;--ink:#E9F2EC;--ink-mut:#8FA79C;--ink-dim:#648176;--line:#1E2B26;
--font-ui:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--font-mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
--s1:6px;--s2:12px;--s3:18px;--s4:24px;--s5:36px;--s6:48px;--radius:12px;--radius-pill:999px;}
[dir="rtl"]{--flow:270deg;--hatch:135deg;}:dir(rtl){--flow:270deg;--hatch:135deg;}
@media (prefers-color-scheme:light){:root{--bg:#FBF7F0;--bg-card:#FFFFFF;--ink:#1C1A17;--line:#E7E1D6;
--ink-mut:#67756D;--ink-dim:#6A736E;--ai:#2B7A8B;--ai-deep:#2B7A8B;--biomass:#527C46;--sovereign:#865FB8;
--sovereign-soft:#865FB8;--you:#B4479D;--info:#4D759B;--verified:#527C46;--guard:#736A9C;}}

/* ==== component styles ==== */
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;line-height:1.5}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:max(var(--s3),env(safe-area-inset-top)) var(--s3) var(--s3)}
.stage{width:100%;max-width:29rem;flex:1;display:flex;flex-direction:column}
a{color:var(--info)}
h1{font-size:1.6rem;line-height:1.2;margin:0 0 var(--s2)}
h2{font-size:1.25rem;margin:0 0 var(--s1)}
p{margin:0 0 var(--s3);color:var(--ink-mut)}
.muted{color:var(--ink-dim);font-size:.85rem}
.mono{font-family:var(--font-mono)}

/* top rail: brand + network state + language */
.top{width:100%;max-width:29rem;display:flex;align-items:center;gap:var(--s2);
  margin-block-end:var(--s5)}
.mark{width:26px;height:26px;border-radius:8px;background:var(--rainbow);flex:none;
  box-shadow:0 0 0 1px var(--line)}
.brand{font-weight:700;letter-spacing:.02em}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;
  padding:5px 10px;border-radius:var(--radius-pill);border:1px solid var(--line);
  background:var(--bg-card);color:var(--ink-mut);cursor:pointer;min-height:32px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--verified)}
.chip.off .dot{background:var(--guard)}
select.lang{font:inherit;font-size:.72rem;background:var(--bg-card);color:var(--ink-mut);
  border:1px solid var(--line);border-radius:var(--radius-pill);padding:5px 8px;min-height:32px}

/* progress dots (designation-aware) */
.rail{display:flex;align-items:center;gap:8px;margin-block-end:var(--s4);flex-wrap:wrap}
.badge{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:3px 8px;border-radius:var(--radius-pill);border:1px solid var(--line);color:var(--ink-mut)}
.badge.desig{color:var(--sovereign-soft);border-color:color-mix(in srgb,var(--sovereign) 40%,var(--line))}
.dots{display:flex;gap:6px;margin-inline-start:auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--primary)}
.dots i.done{background:var(--verified)}

/* buttons */
.btn{appearance:none;font:inherit;font-weight:650;width:100%;min-height:52px;
  border-radius:var(--radius);border:1px solid transparent;cursor:pointer;
  padding:0 var(--s3);display:flex;align-items:center;justify-content:center;gap:10px;
  margin-block-end:var(--s2);transition:transform .06s,filter .15s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:#150512;border:none}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-dim)}
.btn.link{background:none;border:none;color:var(--info);min-height:44px;width:auto;
  margin:0 auto;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* custody cards — the 8e full surface */
.card{display:flex;gap:var(--s3);align-items:flex-start;text-align:start;
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--s3);margin-block-end:var(--s2);cursor:pointer;width:100%;
  min-height:52px;transition:border-color .15s}
.card:hover{border-color:var(--ink-dim)}
.card:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.card .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  font-size:1.15rem;background:color-mix(in srgb,var(--sovereign) 14%,transparent)}
.card.free .ic{background:color-mix(in srgb,var(--biomass) 16%,transparent)}
.card .body{flex:1;min-width:0}
.card .t{font-weight:650;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .d{font-size:.85rem;color:var(--ink-mut);margin-block-start:3px}
.cost{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:var(--radius-pill);
  border:1px solid var(--line);color:var(--ink-mut);white-space:nowrap}
.cost.free{color:var(--verified);border-color:color-mix(in srgb,var(--biomass) 40%,var(--line))}
.tag{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--sovereign-soft)}

/* panels / honest states */
.panel{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--s3);margin-block-end:var(--s3)}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);
  font-family:var(--font-mono);margin-block:var(--s2)}
.words span{background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:10px 8px;font-size:.9rem}
.words span b{color:var(--ink-dim);font-weight:400;font-size:.7rem;margin-inline-end:6px}
.wordin{width:100%;font:inherit;font-family:var(--font-mono);background:var(--bg);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:12px;min-height:48px;margin-block-end:var(--s2)}
.wordin:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary)}

/* the honey b chip — b amounts ONLY, dark chip only (tokens.css law) */
.bchip{display:inline-flex;align-items:baseline;gap:6px;background:#0A0A0A;
  border:1px solid color-mix(in srgb,var(--b-value) 30%,var(--line));border-radius:var(--radius);
  padding:14px 18px}
.bchip b{color:var(--b-value);font-size:2rem;font-weight:750;font-family:var(--font-mono)}
.bchip span{color:var(--ink-dim)}

/* gauge states (DESIGN-BRIEF-01 §6) */
.gauge{display:flex;align-items:center;gap:8px;font-size:.82rem;padding:8px 0}
.gauge .s{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:6px}
.g-known .s{color:var(--verified);border:1px solid color-mix(in srgb,var(--biomass) 40%,var(--line))}
.g-stale .s{color:var(--ink-mut);border:1px dashed var(--ink-dim)}
.g-absent .s{color:var(--guard);border:1px solid color-mix(in srgb,var(--guard) 45%,var(--line))}

/* optical (decimen) mock */
.qr{width:190px;height:190px;margin:var(--s2) auto;border-radius:var(--radius);
  border:1px solid var(--line);background:
    repeating-conic-gradient(var(--ink) 0 25%, var(--bg) 0 50%);
  background-size:22px 22px;animation:flick .18s steps(2) infinite;
  box-shadow:0 0 0 8px var(--bg-card)}
@keyframes flick{50%{filter:invert(1)}}

/* spinner */
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--primary);animation:sp 1s linear infinite;margin:var(--s4) auto}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.grow{flex:1}
.foot{width:100%;max-width:29rem;margin-block-start:var(--s4);padding-block-start:var(--s3);
  border-top:1px solid var(--line);color:var(--ink-dim);font-size:.72rem;text-align:center}
.hide{display:none!important}

/* silk: every screen rises in gently; honest about motion preferences */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage>*{animation:rise .22s ease both}
@media (prefers-reduced-motion:reduce){.qr,.spin,.stage>*{animation:none}}
</style>
</head>
<body>

<div class="top">
  <span class="mark" aria-hidden="true"></span>
  <span class="brand">BNR</span>
  <span class="spacer"></span>
  <button class="chip" id="net" onclick="APP.toggleNet()" title="Works with or without a network">
    <span class="dot"></span><span id="net-t">Online</span>
  </button>
  <select class="lang" id="lang" onchange="APP.setLang(this.value)" aria-label="Language">
    <option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option>
    <option value="fr">FR</option><option value="de">DE</option><option value="ar">العربية ‏</option>
    <option value="zh">简体</option><option value="hi">हिन्दी</option>
    <option value="new">＋ yours</option>
  </select>
</div>

<main class="stage" id="stage"><!-- screens injected here --></main>

<div class="foot">
  UX preview · zero-network by construction · auth steps here are <b>SIMULATED, labeled
  honestly</b> (house law: PLANNED/REFUSED, never mock) — they bind real when served from
  <span class="mono">wallet-relay</span>. Seat prepares UNSIGNED only; no key ever enters this page.
</div>

<script src="vendor/qrcodegen.js"></script>
<script src="bzdid-key.js"></script> <!-- vendored key engine: PRF→master_prk→Ed25519, BIP39, fingerprints -->
<script>
"use strict";
/* ===========================================================================
   Ceremony state machine. Each screen is a typed stage; advancing carries a
   small context object forward — the serialization-boundary shape from
   RAID_AUTHENTIK §18 (component + payload), so the same machine could drive a
   TUI, a phone, or an optical/paper packet, not just this DOM renderer.
   =========================================================================== */
/* Key derivation is REAL when the vendored engine (bzdid-key.js) is present.
   PREVIEW now means "keys not real" and flips automatically; ANCHORING remains
   unbuilt either way and keeps its own Working gauge in creating(). */
const ENGINE = window.BZDIDKEY || null;
const KEYS_REAL = !!ENGINE;
const PREVIEW = !KEYS_REAL;

const APP = {
  ctx:{ designation:"first-join", online:true, custody:null, remediated:false },
  hist:[],

  go(screen, keep){ if(keep!==false) this.hist.push(this.current); this.current=screen; render(screen); },
  back(){ const s=this.hist.pop(); if(s){ this.current=s; render(s); } },

  toggleNet(){ this.ctx.online=!this.ctx.online;
    const on=this.ctx.online;
    document.getElementById('net').classList.toggle('off',!on);
    document.getElementById('net-t').textContent = on?'Online':'Offline · mesh';
    // re-render custody so the offline-native option is highlighted
    if(this.current==='custody') render('custody');
  },
  setLang(v){
    if(v==='new'){
      // the tribal-corpus breadcrumb: every language belongs, incl. ones no
      // corporation would ever localize. Voluntary corpus, AI-guided.
      const f=document.querySelector('.foot');
      f.innerHTML='🌍 <b style="color:var(--ink)">Your language belongs here.</b> BNR is building a voluntary language corpus — including tribal and uncommon languages the big platforms skip — so this page can one day greet everyone in their own words. Ask us how to contribute yours.';
      return;
    }
    document.documentElement.setAttribute('dir', v==='ar'?'rtl':'ltr');
  },
};

/* --- the 8e full surface: every option that clears the filter, none elected.
   Names match Design's wallet MVP ladder (LARVA/PUPA/BEE/ROYAL GUARD, T-F/T-H
   seam) + the optical air-gap rung ruled in 2026-08-14 (free hardware custody,
   RAID_DECIMEN use-case 1). --- */
const LADDER = [
  { id:'passkey', ic:'🔑', free:true, rung:'🐛 LARVA · T-F', title:'This device',
    cost:'Free', tag:'Passkey',
    desc:'Face / fingerprint / Windows Hello. Your key lives on this device — nothing to buy, nothing to carry.' },
  { id:'optical', ic:'📷', free:true, rung:'AIR-GAP · T-H-grade', title:'A spare phone',
    cost:'Free', tag:'Optical signer',
    desc:'Pair a second phone as an offline signer — keys travel as light, never over a network. Hardware-grade custody at zero cost. Works with no signal at all.' },
  { id:'key', ic:'🛡️', free:false, rung:'🛡 PUPA · T-F roaming', title:'A security key',
    cost:'~$25', tag:'FIDO2 + code',
    desc:'A tap-to-sign key you carry (YubiKey, SoloKey) plus a backup code. Portable hardware backing.' },
  { id:'trezor', ic:'🔒', free:false, rung:'🐝 BEE → 👑 ROYAL GUARD', title:'Any Trezor',
    cost:'$79–249', tag:'Open hardware',
    desc:'Every Trezor model works out of the box. Open hardware, open firmware — custody you can audit, which the closed-source world never offers. Flash the free Trezor bSAFE 7 firmware later to unlock every BNR chain.' },
];

/* --- copy per stage; kept declarative so localization is a table swap --- */
const SCREENS = {

  welcome(){ return `
    <div class="grow">
      <span class="badge desig">First join</span>
      <h1 style="margin-top:var(--s4)">Your keys. Your resources.<br>No one in between.</h1>
      <p>Start free in this browser. No account, no app, no one holding anything for you.
         Add stronger custody whenever you like — your identity never changes.</p>
    </div>
    <button class="btn primary" onclick="APP.door('new')">I'm new here — start free →</button>
    <button class="btn ghost" onclick="APP.door('pro')">I know wallets — skip the tour</button>
    <button class="btn ghost" onclick="APP.door('hw')">I run hardware — Trezor / security key</button>
    <button class="btn link" onclick="APP.go('returning')">Already have BNR? Recover · add device · continue</button>
  `; },

  /* Returning designations — one machine, many ceremonies. Each is a REAL
     screen; where the backing build is pending, the screen says so. */
  returning(){ return stageWrap(1, `
    <h2>Welcome back</h2>
    <p>Same identity, different ceremony — pick what happened:</p>
    <button class="card" onclick="APP.go('recover')"><span class="ic">📄</span><span class="body">
      <span class="t">I lost my device — I have my ${ENGINE?24:12} words</span>
      <span class="d">Rebuild your wallet from the written phrase. Your identity comes back with it.</span></span></button>
    <button class="card free" onclick="APP.go('addDevice')"><span class="ic">➕</span><span class="body">
      <span class="t">Add THIS device to my existing wallet</span>
      <span class="d">This device shows a code; a device you already trust scans and approves it. Nothing secret crosses.</span></span></button>
    <button class="card" onclick="APP.go('resume')"><span class="ic">▶️</span><span class="body">
      <span class="t">Continue a ceremony I started elsewhere</span>
      <span class="d">Scan or paste the resume code from your other screen — it picks up exactly where you stood.</span></span></button>
    <button class="btn link" onclick="APP.go('welcome')">← Start fresh instead</button>
  `); },

  recover(){ return stageWrap(1, `
    <span class="badge desig">Recover</span>
    <h2 style="margin-top:var(--s3)">Enter your ${ENGINE?24:12} words</h2>
    <p>Type them in order. They never leave this device.</p>
    <textarea class="wordin" id="rec-words" rows="3" autocomplete="off" autocapitalize="none"
      onpaste="opsecPasteNote('rec-opsec')" placeholder="word1 word2 word3 …"></textarea>
    <div id="rec-opsec"></div>
    ${PREVIEW?`<div class="gauge g-absent"><span class="s">Preview</span> Recovery derivation is not built yet — this screen validates SHAPE (12 words) and refuses honestly; it cannot restore anything today and says so rather than pretending.</div>`:`<div class="gauge g-known"><span class="s">Real</span> Recovery derivation is live — 24 words (or a bdidrec1… code) rebuild your keys right here, offline.</div>`}
    <div id="rec-err" class="muted" style="color:var(--guard);min-height:1.2em"></div>
    <button class="btn primary" onclick="APP.tryRecover()">Recover my wallet</button>
    <button class="btn link" onclick="APP.go('returning')">← Back</button>
  `); },

  addDevice(){ setTimeout(drawPairQr,0); return stageWrap(1, `
    <span class="badge desig">Add device</span>
    <h2 style="margin-top:var(--s3)">Approve this device from one you trust</h2>
    <p>This new device shows the code (it contains only a fresh PUBLIC key). Scan it
       with your trusted device's BNR wallet, approve, and this device joins —
       the safe direction: the new device displays, the trusted one signs.</p>
    <div class="center">
      <canvas id="pairqr" width="290" height="290"
        style="width:230px;height:230px;border-radius:var(--radius);box-shadow:0 0 0 6px #fff,0 0 0 9px var(--line);image-rendering:pixelated"></canvas>
    </div>
    <div class="center muted" id="pairqr-note">Waiting for a trusted device to scan and approve…</div>
    ${PREVIEW?`<div class="gauge g-planned" style="margin-top:var(--s2)"><span class="s">Planned</span> The approval return-path lands with the trusted-wallet surface; this screen's request side is real.</div>`:''}
    <button class="btn link" onclick="APP.go('returning')">← Back</button>
  `); },

  resume(){ return stageWrap(1, `
    <span class="badge desig">Resume</span>
    <h2 style="margin-top:var(--s3)">Continue where you stood</h2>
    <p>Paste the resume code from your other screen (or scan it with the receiver page).</p>
    <textarea class="wordin" id="res-paste" rows="3" placeholder="bnr-resume code…"></textarea>
    <div id="res-err" class="muted" style="color:var(--guard);min-height:1.2em"></div>
    <button class="btn primary" onclick="APP.tryResume()">Continue ceremony</button>
    <button class="btn link" onclick="APP.go('returning')">← Back</button>
  `); },

  custody(){
    const offline = !APP.ctx.online;
    const persona = APP.ctx.persona||'new';
    // hardware people see their gear first; everyone else sees the free rungs first
    const order = persona==='hw' ? ['trezor','key','optical','passkey'] : ['passkey','optical','key','trezor'];
    const ladder = order.map(id=>LADDER.find(o=>o.id===id));
    const cards = ladder.map(o=>{
      const nudge = (o.id==='optical' && offline)
        ? `<div class="tag" style="margin-top:6px">✓ works right now — no network needed</div>` : '';
      return `
      <button class="card ${o.free?'free':''}" onclick="APP.pick('${o.id}')">
        <span class="ic">${o.ic}</span>
        <span class="body">
          <span class="t">${o.title}
            <span class="cost ${o.free?'free':''}">${o.cost}</span></span>
          <span class="d">${o.desc}</span>
          <span class="tag" style="display:block;margin-top:6px">${o.tag} · ${o.rung}</span>
          ${nudge}
        </span>
      </button>`;
    }).join('');
    const intro = persona==='pro'
      ? 'Self-custody throughout; WebAuthn, air-gapped optical signer, FIDO2, or Trezor. Same bzDiD at every rung.'
      : persona==='hw'
      ? 'Your hardware works out of the box — and the free optical rung below is the air-gap trick even hardware people haven\'t seen.'
      : `Every option below is fully sovereign — pick what fits today. ${offline?'<b style="color:var(--verified)">Offline right now</b>, so the spare-phone path is your fastest.':'You can climb the ladder later without re-doing anything.'}`;
    return `
      ${railHTML(1)}
      <h2>Choose how you hold your keys</h2>
      <p>${intro}</p>
      ${cards}
      <p class="muted" style="margin-top:var(--s2)">More custody = more sovereignty. You keep the same wallet and the same identity at every rung — this is a climb, not a restart.</p>
    `;
  },

  /* passkey ceremony (real WebAuthn attempted, simulated on failure) */
  passkey(){ return stageWrap(2, `
    <h2>Create your passkey</h2>
    <p>Your device makes a key only it can use, unlocked by your face or fingerprint.
       BNR never sees it.</p>
    <button class="btn primary" onclick="APP.doPasskey(this)">Use Face / Touch / Hello</button>
    <button class="btn link" onclick="APP.go('custody')">← Pick a different method</button>
  `); },

  /* re-entrant remediation — authentik's killer move: you can't pass the gate
     yet, here is the sub-ceremony that lets you. Offered as a CHOICE. */
  remediate(kind){
    const label = kind==='key' ? 'security key' : 'Trezor'; // bare noun — sentences below add their own article ("No a Trezor" round-7 catch)
    return stageWrap(2, `
      <span class="badge" style="color:var(--guard);border-color:color-mix(in srgb,var(--guard) 45%,var(--line))">Nothing plugged in</span>
      <h2 style="margin-top:var(--s3)">No ${label} detected</h2>
      <p>That's fine — you don't have to buy anything to be secure right now.
         Choose how to continue:</p>
      <button class="btn primary" onclick="APP.remediateTo('optical')">
        📷 Use a spare phone instead — free hardware custody
      </button>
      <button class="btn ghost" onclick="APP.remediateTo('passkey')">
        🔑 Start with this device's passkey (add a ${label} later)
      </button>
      <button class="btn link" onclick="APP.go('custody')">← Back to all options</button>
      <p class="muted" style="margin-top:var(--s3)">You can always add a ${label} later — the same wallet just gains a stronger lock.</p>

/* ---------- key build (engine-backed) ----------
   Root policy: with a PRF-capable passkey the root derives from the PRF secret
   (two doors — passkey and phrase — one root). Without PRF, the root is fresh
   entropy and the PHRASE is the only root door; the passkey (if any) is an
   authenticator only. Either way the authenticator is a key, never the identity
   (crates/onboarding/src/lib.rs). */
APP.establishRoot = function(prfSecret){
  if(!ENGINE) return;
  const prk = prfSecret ? ENGINE.masterPrkFromPrfSecret(prfSecret)
                        : crypto.getRandomValues(new Uint8Array(32));
  if(prfSecret) prfSecret.fill(0);
  if(APP._root) APP._root.fill(0);
  APP._root = prk;
  APP._id = ENGINE.deriveIdentity(prk, 'bnr.b');
  APP._words = APP._id.phrase.split(' ');
  APP.ctx.rootDoor = prfSecret ? 'passkey+phrase' : 'phrase-only';
};

/* ---------- behaviors ---------- */
APP.pick = function(id){
  this.ctx.custody = id;
  if(id==='passkey') return this.go('passkey');
  if(id==='optical') return this.go('optical');
  if(id==='key' || id==='trezor'){
    // Straight to the device screen — ALWAYS. (Round 7 fix: a leftover demo
    // coin-flip was detouring 60% of Trezor clicks into remediation. Remediation
    // is for REAL failure or explicit request, never chance.)
    this._rk=id; this.hist.push(this.current); this.current='hardware';
    return render(()=>SCREENS.hardware(id));
  }
};
APP.door = function(persona){ this.ctx.persona=persona; this.go('custody'); };

APP.tryRecover = function(){

    try{

APP.tryResume = function(){

APP.doPasskey = async function(btn){
  btn.disabled=true; btn.textContent='Waiting for your device…';
  let ok=false;
  try{
    if(window.PublicKeyCredential && location.protocol!=='file:'){
      if(ENGINE){
        // Real ceremony. UV MUST be "required" at create AND get — CTAP2 returns a
        // DIFFERENT PRF secret for non-UV assertions; "preferred" would let a later
        // login silently derive a different identity (lockout that looks like data
        // loss). residentKey "required" → discoverable; nothing stored but the passkey.
        const enr = await ENGINE.enrollPasskey('you@bnr');
        if(enr.prfEnabled){
          // Layer-2 capability answer is yes → PRF assertion → derive the root.
          const prf = await ENGINE.getPrfSecret();
          APP.establishRoot(prf);
        }else{
          // Honest fallback rung: passkey authenticates, but this authenticator
          // cannot derive (no PRF). Root = fresh entropy; the PHRASE is the root door.
          APP.establishRoot(null);
        }
        ok=true;

        await navigator.credentials.create({ publicKey:{
          challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:'BNR'},
          user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'you@bnr',displayName:'You'},
          pubKeyCredParams:[{type:'public-key',alg:-8},{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
          authenticatorSelection:{residentKey:'required',userVerification:'required'}, timeout:60000 }});
        ok=true;

  // Where real WebAuthn exists, a cancel shows the refusal + retry; only the

/* The one-scan install+pair link (founder direction 2026-08-14, after the first
   successful 186-byte optical transfer): the QR carries a URL any stock camera
   opens — the receiver page — with the pairing envelope in the FRAGMENT, which
   never leaves the phone (fragments are not sent to any server). One scan =
   install (page opens) + pair (payload delivered). The BNR receiver also reads
   the same code directly. */
const PUBLIC_RECEIVER='https://beehive-nature.github.io/beehive-nature/surfaces/onboarding/receive.html';
function receiverBase(){
  // served same-origin? use our own receiver; file:// preview? use the public one.
  // AUDIT FIX (blocker): the relay serves the wizard at /onboard (no filename),
  // where filename-replacement built /receive.html — a route that did not exist.
  // Route-aware now, and the relay also aliases the .html spellings.
  if(location.protocol==='http:'||location.protocol==='https:'){
    // localhost is only reachable from THIS machine — a QR meant for another
    // device must never carry it (found live 2026-08-19: laptop-rendered QR,
    // A16 scan → dead link). Same rule as file://: fall back to the public
    // receiver; the payload rides the #fragment either way and never touches
    // a server. A LAN-IP origin stays as-is — other devices can reach it.
    if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return PUBLIC_RECEIVER;
    const p=location.pathname;
    if(/\/onboard\/?$/.test(p)) return location.origin+p.replace(/\/$/,'')+'/receive';
    return location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,'')+'receive.html';
  }
  return PUBLIC_RECEIVER;
}
function receiverIsPublicFallback(){
  return (location.protocol==='http:'||location.protocol==='https:')
    && /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
}
function b64url(bytes){ return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }

/* Render the REAL pairing QR (vendored qrcodegen). If the vendor file is absent
   (this file copied alone), say so honestly instead of faking a pattern. */
function drawPairQr(){
  const cv=document.getElementById('pairqr'); if(!cv) return;
  // The nonce belongs to the CEREMONY, not the rendering: issue it before any
  // display concern, so a missing encoder can never leave the nonce unset (a
  // vacuous undefined===undefined check downstream — the bug verification caught).
  APP._pairNonce=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>x.toString(16).padStart(2,'0')).join('');
  if(!(window.qrcodegen&&qrcodegen.QrCode)){
    document.getElementById('pairqr-note').innerHTML=
      '⚠ encoder not loaded (vendor/qrcodegen.js missing) — no code rendered; the folder ships together';
    cv.style.display='none'; return;
  }
  const pk=new Uint8Array(32); crypto.getRandomValues(pk);
  const env=JSON.stringify({v:1,kind:'bnr-pair-request',
    pubkey:'PREVIEW_'+b64url(pk), designation:APP.ctx.designation,
    nonce:APP._pairNonce,
    expiry:new Date(Date.now()+5*60*1000).toISOString()});
  const link=receiverBase()+'#p='+b64url(new TextEncoder().encode(env));
  if(receiverIsPublicFallback()){
    const n=document.getElementById('pairqr-note');
    if(n) n.innerHTML='ℹ serving from localhost — the QR points at the <b>public receiver</b> so your other device can reach it (a localhost link would be dead off this machine)';
  }
  const qr=qrcodegen.QrCode.encodeText(link, qrcodegen.QrCode.Ecc.MEDIUM);
  const quiet=4, scale=Math.floor(cv.width/(qr.size+quiet*2));
  const g=cv.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle='#000';
  const off=Math.floor((cv.width-qr.size*scale)/2);
  for(let y=0;y<qr.size;y++)for(let x=0;x<qr.size;x++)
    if(qr.getModule(x,y)) g.fillRect(off+x*scale, off+y*scale, scale, scale);
}

/* ---- REAL Trezor connection (BEE lane) ----
   Official Trezor Connect v10 — THEIR script, THEIR consent popup, Bridge (ships
   with Trezor Suite) or WebUSB. Loaded ON CLICK ONLY: the wizard performs zero
   network egress until the user explicitly invokes Trezor's own rail
   (EGRESS.md row: connect.trezor.io, click-gated). The bSAFE 7 lane later
   replaces this with our own native transport in the dashboard. */
/* BNR NATIVE LANE (founder-ruled: never wait on a third party). The relay talks
   to the LOCAL Trezor Bridge itself — /v1/trezor/native/features — so this works
   only when the wizard is SERVED BY THE RELAY (same origin). On Pages/file://
   the fetch fails and says so honestly. */
async function trezorNativeReal(btn){
  const st=document.getElementById('tz-status');
  btn.disabled=true; st.textContent='Asking the BNR relay to handshake with the device…';
  try{
    const r=await fetch('/v1/trezor/native/features');
    const j=await r.json();
    if(!j.ok) throw new Error(`[${j.stage}] ${j.why}`);
    const f=j.result;
    if(f.features_msg && f.firmware){
      APP.ctx.trezorReal={name:'Trezor (native lane)', fw:f.firmware, label:f.vendor||''};
      st.style.color='var(--verified)';
      st.textContent=`✓ REAL device · firmware ${f.firmware} · answered over the BNR native bridge — no third-party page involved`;
      setTimeout(()=>{ if(APP.current==='hardware'&&APP.ctx.custody==='trezor') APP.hardwareDone(); }, 900);
    }else{
      throw new Error(`device answered msg_type ${f.response_msg_type} (not Features) — protocol stage incomplete; honest partial: transport works, framing next`);
    }
  }catch(e){
    btn.disabled=false;
    st.textContent = (location.protocol==='https:'&&!location.host.includes('localhost'))
      ? `Native lane needs the relay origin: run wallet-relay and open http://localhost:8080/onboard — this page (${location.host}) cannot reach your localhost bridge. (${e.message})`
      : `Refused/failed honestly: ${e.message}`;
  }
}

let _tcReady=null;
function preloadTrezorConnect(){
  // Fired on ENTERING the Trezor step (explicit user intent — they clicked the
  // card). Preloading here means the CLICK only opens the popup, inside the
  // browser's user-gesture window — round-7 fix: loading on click ate the
  // gesture in awaits and Edge/Chrome silently blocked the popup.
  if(_tcReady) return _tcReady;
  _tcReady=(async()=>{
    if(!window.TrezorConnect){
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        // PROBE-VERIFIED 2026-08-14: /9/trezor-connect.js -> 200 text/javascript.
        // (/10/trezor-connect.js is a 404 -- the round-8 "no popup anywhere" root
        // cause: a guessed URL. Verify the URL, not just the API.)
        s.src='https://connect.trezor.io/9/trezor-connect.js';
        s.onload=res; s.onerror=()=>rej(new Error('connect.trezor.io unreachable'));
        document.head.appendChild(s);
      });
      await TrezorConnect.init({
        lazyLoad:true,
        manifest:{ email:'loviswater44@gmail.com', appUrl:'https://beehive-nature.github.io/beehive-nature/' },
      });
    }
  })();
  _tcReady.catch(()=>{ _tcReady=null; }); // allow retry after a failed load
  return _tcReady;
}
async function trezorConnectReal(btn){
  const st=document.getElementById('tz-status');
  btn.disabled=true;
  try{
    st.textContent='Readying Trezor’s rail…';
    await preloadTrezorConnect();
    st.textContent='Look for Trezor’s popup (allow popups if nothing appears) — approve, then check the device…';
    const r=await Promise.race([
      TrezorConnect.getFeatures(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timed out after 30s — a popup blocker is the usual cause; allow popups for this site and retry')),30000)),
    ]);
    if(!r.success) throw new Error(r.payload?.error||'device did not answer');
    const p=r.payload||{};
    const NAMES={T1B1:'Trezor Model One',T2T1:'Trezor Model T',T2B1:'Trezor Safe 3',
                 T3B1:'Trezor Safe 3',T3T1:'Trezor Safe 5',T3W1:'Trezor Safe 7'};
    const name=NAMES[p.internal_model]||`Trezor (${p.internal_model||p.model||'unknown model'})`;
    APP.ctx.trezorReal={ name,
      fw:[p.major_version,p.minor_version,p.patch_version].filter(x=>x!=null).join('.'),
      label:p.label||'' };
    st.style.color='var(--verified)';
    st.textContent=`✓ ${name}${APP.ctx.trezorReal.label?` “${APP.ctx.trezorReal.label}”`:''} · firmware ${APP.ctx.trezorReal.fw} — REAL device, verified over Trezor Connect`;
    // AUDIT FIX (medium): guard the deferred advance — the user may have
    // navigated away inside the 900ms; a stale timer must never move them.
    setTimeout(()=>{ if(APP.current==='hardware'&&APP.ctx.custody==='trezor') APP.hardwareDone(); }, 900);
  }catch(e){
    btn.disabled=false;
    st.textContent=`Refused/failed honestly: ${e.message}. Is the device plugged in and unlocked? (If Suite is mid-update, Bridge may be restarting — try again after.)`;
  }
}

/* ---- reply-leg verification (wizard side) ---- */
let replyStream=null;
async function replyCamStart(){
  const slot=document.getElementById('replycam-slot'); if(!slot) return;
  const secure=window.isSecureContext, hasCam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia), hasDet='BarcodeDetector' in window;
  if(!secure||!hasCam||!hasDet){
    slot.innerHTML=`<div class="panel"><div class="gauge g-absent"><span class="s">No scan here</span>
      ${!secure?'Not a secure context — camera blocked by the browser.':!hasCam?'No camera API in this browser.':'No native QR decoder in this browser (typical on desktop).'}
      Use the paste fallback below — same verification, same result.</div></div>`;
    return;
  }
  try{
    replyStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  }catch(e){ slot.innerHTML='<div class="panel"><div class="gauge g-absent"><span class="s">Refused</span> Camera permission declined — paste fallback below works the same.</div></div>'; return; }
  slot.innerHTML='<video id="replycam" playsinline muted style="width:220px;border-radius:12px;border:1px solid var(--line)"></video>';
  const v=document.getElementById('replycam'); v.srcObject=replyStream; await v.play();
  const det=new BarcodeDetector({formats:['qr_code']});
  (async function loop(){
    if(!document.getElementById('replycam')) return replyCamStop();
    try{ const c=await det.detect(v); if(c.length){ replyCamStop(); return verifyReply(c[0].rawValue); } }catch(e){}
    requestAnimationFrame(loop);
  })();
}
function replyCamStop(){ if(replyStream){ replyStream.getTracks().forEach(t=>t.stop()); replyStream=null; } }

async function verifyReply(text){
  const err=m=>{ const e=document.getElementById('reply-err'); if(e) e.textContent=m; };
  if(!text||!text.trim()) return err('Nothing to verify yet — scan the code or paste the reply text.');
  let raw=text.trim();
  const m=/#p=([A-Za-z0-9_-]+)/.exec(raw);
  if(m){ try{ raw=new TextDecoder().decode(Uint8Array.from(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))); }catch(e){} }
  let obj=null; try{ obj=JSON.parse(raw); }catch(e){ return err('That is not a reply — could not parse it.'); }
  if(obj.kind!=='bnr-enroll-pubkey') return err(`Refused: kind "${obj.kind||'?'}" is not a pairing reply.`);
  // ABSENCE REFUSES — never a vacuous match: no issued nonce, or no echo, is a hard no.
  if(!APP._pairNonce) return err('Refused: this screen has not issued a pairing request — nothing to verify against.');
  if(!obj.echo_nonce) return err('Refused: the reply carries no nonce echo — it cannot be bound to this request.');
  if(String(obj.echo_nonce)!==String(APP._pairNonce)) return err(`Refused: nonce mismatch — this reply answers a DIFFERENT request (got ${String(obj.echo_nonce).slice(0,16)}). Replays and stale codes are rejected exactly like this.`);
  const preview=String(obj.pubkey||'').startsWith('PREVIEW_');
  let sigOk=false;
  if(obj.sig&&!preview){
    try{
      const pub=Uint8Array.from(atob(String(obj.pubkey).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      const key=await crypto.subtle.importKey('raw',pub,{name:'Ed25519'},true,['verify']);
      const body=JSON.stringify({v:obj.v,kind:obj.kind,pubkey:obj.pubkey,echo_nonce:obj.echo_nonce,created:obj.created});
      const sig=Uint8Array.from(atob(String(obj.sig).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
      sigOk=await crypto.subtle.verify({name:'Ed25519'},key,sig,new TextEncoder().encode(body));
      if(!sigOk) return err('Refused: the signature does NOT verify over the reply — tampered or reconstructed. Nothing accepted.');
    }catch(e){ sigOk=false; /* verifier unavailable here — carried, labeled below */ }
  }
  // fingerprint: SHA-256 where WebCrypto exists (secure contexts); labeled FNV
  // fallback elsewhere so verification is TOTAL — it refuses or confirms, never crashes.
  let fp;
  if(crypto.subtle){
    const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(obj.pubkey)));
    fp=Array.from(new Uint8Array(digest)).slice(0,4).map(x=>x.toString(16).padStart(2,'0')).join('');
  }else{
    let h=0x811c9dc5; for(const c of String(obj.pubkey)){ h^=c.charCodeAt(0); h=Math.imul(h,0x01000193)>>>0; }
    fp='fnv-'+h.toString(16).padStart(8,'0');
  }
  APP.ctx.pairConfirmed={fp,sigOk,preview};
  APP.opticalDone();
}

function genWords(){ const bank=['anchor','honey','mesh','sovereign','light','ember','river','cedar',
  'quartz','meadow','signal','harbor','lantern','thistle','cobalt','aurora','pollen','ridge','fathom','willow'];
  const out=[]; for(let i=0;i<12;i++) out.push(bank[Math.floor(Math.random()*bank.length)]); return out; }
function pick3(n){ const s=new Set(); while(s.size<3) s.add(Math.floor(Math.random()*n)); return [...s].sort((a,b)=>a-b); }

function render(screen){
  const html = typeof screen==='function' ? screen() : SCREENS[screen]();
  const el=document.getElementById('stage'); el.innerHTML=html; el.scrollTop=0;
  window.scrollTo(0,0);
}
APP.current='welcome';
render('welcome');
