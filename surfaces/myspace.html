<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>My Space — your files, on this phone, for as long as you choose</title>
<link rel="stylesheet" href="skaists.css">
<style>
/* MY SPACE — the founder's chosen UI (order 2026-10-04: "NOW seems like a good time to bring my
   chosen UI back in", nine screens at 390 px). ONE DOM, three registers: the markup below and the
   rows myspace.js builds are the same in every register; each register changes the dress and the
   words, never the facts. Every painted colour is a skaists token of the register it is worn in
   (skaists.css, compiled from docs/design/skaists/tokens.json), every size is on that register's
   type scale, every corner a radius token; e2e/skaists-conformance.mjs measures #eternal. */
  :root, body[data-reg="bee"] {
    --bg: var(--sk-bg); --card: var(--sk-bg-card); --well: var(--sk-bg-well);
    --line: var(--sk-line); --edge: rgba(106, 115, 110, .4); --ink: var(--sk-ink); --mut: var(--sk-ink-mut);
    --kick: var(--sk-ink-mut); --lede: var(--sk-ink-mut); --accent: var(--sk-forest); --on: var(--sk-on-primary);
    --sel: var(--sk-forest); --danger: var(--sk-rose); --drop-edge: rgba(106, 115, 110, .55);
    --font: var(--sk-font-ui); --hfont: var(--sk-font-ui);
    --r-card: var(--sk-radius-xl); --r-btn: var(--sk-radius-pill); --r-chip: var(--sk-radius-pill); --r-thumb: var(--sk-radius);
    --scrim: rgba(12, 20, 18, .42); --glow: none;
    --thumb: linear-gradient(135deg, rgba(77, 117, 155, .38), rgba(168, 35, 140, .28));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--sk-bg); }
  body { min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font); color-scheme: light; }
  main { max-width: 620px; margin: 0 auto; padding: 6px 16px 40px; }
  button, a, input { font: inherit; color: inherit; }
  .ms { display: flex; flex-direction: column; }

  /* the head: kicker, the big line, the lede, the count */
  .kicker { font: 700 14px/1.4 var(--font); letter-spacing: .12em; color: var(--kick); margin-bottom: 4px; }
  h1 { font: 700 32px/1.12 var(--hfont); letter-spacing: -.025em; color: var(--ink); max-width: 6.6em; }
  .lede { margin: 8px 0 14px; font-size: 16px; line-height: 1.5; color: var(--lede); max-width: 20em; }
  .count { font: 600 15px/1.4 var(--font); color: var(--mut); margin-bottom: 16px; }
  .count .dot { display: inline-block; width: 9px; height: 9px; margin: 0 9px 2px 0; vertical-align: middle; border-radius: var(--sk-radius-pill); background: var(--sel); }
  .count b { color: var(--ink); font-weight: 800; }

  .note { margin: -4px 0 14px; font-size: 15px; line-height: 1.5; color: var(--mut); }
  .note.loud { color: var(--danger); }

  /* empty: a dashed well, then the one primary */
  .drop {
    display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 16px;
    border: 1px dashed var(--drop-edge); border-radius: var(--r-card); background: var(--well);
    text-align: center; margin-bottom: 12px;
  }
  .drop p { font-size: 15px; color: var(--mut); }

  .primary, .ghost, .danger {
    appearance: none; display: inline-flex; align-items: center; justify-content: center; text-align: center;
    min-height: 44px; padding: 8px 15px; border-radius: var(--r-btn); cursor: pointer;
    font: 700 16px/1.2 var(--font); text-decoration: none;
  }
  .primary { background: var(--accent); color: var(--on); border: 0; box-shadow: var(--glow); }
  .ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--edge); }
  .danger { background: transparent; color: var(--danger); border: 1.5px solid var(--danger); }
  .wide { width: 100%; min-height: 52px; font-size: 17px; }
  .primary[disabled], .ghost[disabled], .danger[disabled] { opacity: .55; cursor: default; }
  :is(.primary, .ghost, .danger, .mode):focus-visible { outline: 2px solid var(--sk-focus); outline-offset: 3px; }
  .ms > .primary.wide { margin-bottom: 10px; }

  /* the choice cards: one per purpose a rail can actually answer, built by myspace.js */
  .modes { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .mode {
    display: block; width: 100%; padding: 12px 15px 14px; text-align: left; cursor: pointer;
    border: 1px solid var(--line); border-radius: var(--r-card); background: var(--card); color: var(--ink);
  }
  .mode[aria-pressed="true"] { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
  .mode b { display: block; font: 700 17px/1.35 var(--hfont); margin-bottom: 2px; }
  .mode span { display: block; font-size: 15px; line-height: 1.6; color: var(--mut); }

  /* a file */
  #list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  #list:empty { display: none; }
  .file { padding: 14px 14px 14px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--card); }
  .file .head { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 4px 12px; align-items: start; }
  .file .thumb { width: 48px; height: 48px; border-radius: var(--r-thumb); border: 1px solid var(--line); background-color: var(--card); background-image: var(--thumb); }
  .file .name { font: 700 17px/1.35 var(--hfont); color: var(--ink); overflow-wrap: anywhere; }
  .file .meta { font-size: 15px; line-height: 1.4; color: var(--mut); }
  .file .chip {
    display: inline-flex; align-items: center; min-height: 28px; margin-top: 8px; padding: 0 10px;
    border: 1.5px solid var(--sel); border-radius: var(--r-chip); color: var(--sel);
    font: 700 14px/1.2 var(--font); letter-spacing: .08em;
  }
  .file .hash {
    margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--sk-radius-sm);
    font: 400 14px/1.45 var(--font); color: var(--mut); overflow-wrap: anywhere; white-space: pre-line;
  }
  .file .hash .prov { display: none; }
  body[data-reg="cypherpunk"] .file .hash .prov { display: block; }
  body:not([data-reg="cypherpunk"]) .file .hash:not(:has(.left)) { display: none; }
  .file .hash .left { display: block; color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .file .why { margin-top: 10px; font-size: 15px; line-height: 1.45; color: var(--mut); }

  .law { margin-top: 14px; font-size: 14px; line-height: 1.5; color: var(--mut); }

  /* the sheets: a bottom sheet over a scrim, two answers side by side */
  .sheet { display: none; position: fixed; inset: 0; background: var(--scrim); align-items: flex-end; z-index: 60; }
  body[data-state="delete"] .sheet-del, body[data-state="flip"] .sheet-flip { display: flex; }
  .sheet .card {
    width: 100%; max-width: 620px; margin: 0 auto; padding: 22px 16px calc(22px + env(safe-area-inset-bottom));
    border-radius: var(--sk-radius-xl) var(--sk-radius-xl) 0 0; background: var(--card); border-top: 1px solid var(--line);
  }
  .sheet h2 { font: 700 22px/1.25 var(--hfont); color: var(--ink); margin-bottom: 10px; overflow-wrap: anywhere; }
  .sheet p { font-size: 16px; line-height: 1.5; color: var(--mut); margin-bottom: 18px; }
  .sheet .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 0; }
  .sheet .actions button { min-height: 52px; padding: 8px 12px; font-size: 17px; }
  #flip-actions { grid-template-columns: 1fr; gap: 10px; }

  .hide { display: none !important; }
  body[data-state="empty"] .has-file { display: none !important; }
  body[data-state="file"] .empty-only,
  body[data-state="delete"] .empty-only,
  body[data-state="flip"] .empty-only { display: none !important; }

  /* RAVER — the same page after dark: violet ground, magenta for the one thing to do */
  body[data-reg="raver"] {
    --bg: var(--sk-sovereign-tint); --card: var(--sk-sovereign-wash); --well: var(--sk-sovereign-wash);
    --line: rgba(156, 111, 214, .34); --edge: rgba(156, 111, 214, .55); --ink: var(--sk-ink); --mut: var(--sk-sovereign-soft);
    --kick: var(--sk-sovereign-soft); --lede: var(--sk-sovereign-strong); --accent: var(--sk-you); --on: var(--sk-on-primary);
    --sel: var(--sk-you); --danger: var(--sk-you); --drop-edge: rgba(183, 159, 224, .6);
    --scrim: rgba(6, 17, 12, .62); --glow: 0 0 28px rgba(214, 85, 187, .38);
    --thumb: linear-gradient(135deg, rgba(111, 169, 224, .42), rgba(111, 169, 224, .3));
    color-scheme: dark;
    background-image: radial-gradient(120% 55% at 0% 100%, rgba(111, 169, 224, .09), transparent 60%),
      linear-gradient(180deg, var(--sk-sovereign-wash), var(--sk-sovereign-tint) 42%);
    background-attachment: fixed;
  }
  body[data-reg="raver"] .kicker { font-size: 13px; }
  body[data-reg="raver"] h1 { font-size: 30px; line-height: 1.12; letter-spacing: -.03em; max-width: 6.8em; }
  body[data-reg="raver"] :is(.lede, .drop p, .mode span, .file .meta, .file .why, .sheet p, .ghost, .danger, .count) { font-size: 15px; }
  body[data-reg="raver"] :is(.note, .law, .file .hash) { font-size: 14px; }
  body[data-reg="raver"] :is(.mode b, .file .name, .wide, .sheet .actions button) { font-size: 18px; }
  body[data-reg="raver"] .file .chip { font-size: 13px; }
  body[data-reg="raver"] .sheet h2 { font-size: 28px; }
  body[data-reg="raver"] .sheet .card { border-top-color: rgba(156, 111, 214, .55); }

  /* CYPHERPUNK — the instrument: mono, cut corners, the hash on the card */
  body[data-reg="cypherpunk"] {
    --bg: var(--sk-bg); --card: var(--sk-bg-card); --well: var(--sk-bg);
    --line: var(--sk-line); --edge: rgba(100, 129, 118, .7); --ink: var(--sk-ink); --mut: var(--sk-ink-mut);
    --kick: var(--sk-ink-mut); --lede: var(--sk-ink-mut); --accent: var(--sk-primary); --on: var(--sk-on-primary);
    --sel: var(--sk-ai); --danger: var(--sk-cat-bug); --drop-edge: rgba(100, 129, 118, .7);
    --font: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; --hfont: var(--font);
    --r-card: 4px; --r-btn: 4px; --r-chip: 4px; --r-thumb: 4px;
    --scrim: rgba(6, 17, 12, .66);
    --thumb: linear-gradient(135deg, rgba(69, 194, 220, .32), rgba(134, 204, 114, .3));
    color-scheme: dark; font-size: 13px;
  }
  body[data-reg="cypherpunk"] .kicker { font: 600 12px/1.45 var(--font); letter-spacing: .06em; }
  body[data-reg="cypherpunk"] h1 { font-size: 22px; line-height: 1.3; letter-spacing: 0; max-width: 16.5ch; }
  body[data-reg="cypherpunk"] :is(.lede, .mode span, .file .meta, .file .why, .sheet p, .note) { font-size: 13px; line-height: 1.55; }
  body[data-reg="cypherpunk"] .lede { max-width: none; }
  body[data-reg="cypherpunk"] :is(.count, .drop p, .ghost, .danger, .sheet .actions button) { font-size: 15px; }
  body[data-reg="cypherpunk"] :is(.primary, .wide) { font-size: 14px; }
  body[data-reg="cypherpunk"] :is(.mode b, .sheet h2) { font-size: 18px; }
  body[data-reg="cypherpunk"] .file .name { font-size: 15px; }
  body[data-reg="cypherpunk"] :is(.law, .file .hash) { font-size: 12px; }
  body[data-reg="cypherpunk"] .file .chip { font-size: 12px; letter-spacing: .04em; }
  body[data-reg="cypherpunk"] .count b { font-weight: 700; }
  body[data-reg="cypherpunk"] .sheet .card { border-radius: 0; }
</style>
</head>
<!-- `data-busy` and `data-busy-seq` start at 0 so both exist before the first
     act. A reader that has to tell "not busy" from "not published yet" is
     reading two different things through one absence. -->
<body data-reg="bee" data-state="empty" data-bee-theme="custom" data-busy="0" data-busy-seq="0">

<main>
<!-- ONE surface, the founder's chosen UI (2026-10-04). Every word below that carries
     data-reg-copy is rewritten per register by myspace.js; the cards, the file rows and the
     sheets are built there from what the attached rails DECLARE, so nothing here promises a
     purpose before a rail has said it can keep it. `#eternal` is the scope the design-system
     meter measures. -->
<section id="eternal" class="ms" aria-label="My Space">
  <p class="kicker" data-reg-copy="kicker">MY SPACE</p>
  <h1 data-reg-copy="title">Your files live on this phone.</h1>
  <p class="lede" data-reg-copy="lede">Add a file from this phone.</p>
  <p class="count" id="count"><i class="dot" aria-hidden="true"></i><span class="lbl">On this phone:</span> <b class="n">0 files</b></p>

  <p class="note" id="status" hidden></p>

  <div id="list"></div>

  <div class="drop empty-only">
    <p data-reg-copy="empty">Nothing here yet.</p>
  </div>
  <button class="primary wide empty-only" type="button" data-attach="1" data-reg-copy="attach">Add a file from this phone</button>

  <!-- Built by myspace.js from what the attached adapters declare. Empty in the
       markup on purpose: a purpose printed here as a literal would be a promise
       the page makes before it has asked any rail whether it can keep it.
       It stays on screen with a file on the page (2026-09-20): a visitor with one
       file must still be able to choose what the next one is for. -->
  <div class="modes" id="modes" role="group" aria-label="what the next file is for"></div>

  <button class="ghost wide has-file" type="button" data-attach="1" data-reg-copy="attach-more">Add another file</button>

  <input type="file" id="picker" hidden>

  <p class="law" data-reg-copy="law">Your list stays on this phone. A new phone starts empty.</p>
</section>
</main>

<div class="sheet sheet-del" role="dialog" aria-modal="true" aria-labelledby="del-title">
  <div class="card">
    <h2 id="del-title">Delete this file?</h2>
    <p id="del-body"></p>
    <div class="actions">
      <button class="ghost" type="button" id="delKeep" data-reg-copy="keep">Keep it</button>
      <button class="primary" type="button" id="delConfirm" data-reg-copy="confirm">Delete</button>
    </div>
  </div>
</div>

<div class="sheet sheet-flip" role="dialog" aria-modal="true" aria-labelledby="flip-title">
  <div class="card">
    <h2 id="flip-title">Where should this live?</h2>
    <p id="flip-body"></p>
    <!-- One button per OTHER purpose a rail can answer, built by myspace.js.
         With three rails this is no longer a toggle, and a toggle-shaped control
         would have to choose one of two destinations for the visitor. -->
    <div class="actions" id="flip-actions"></div>
  </div>
</div>

<script src="onboarding/vendor/bnr-sign.js"></script>
<script src="adapter-seam.js"></script>
<script src="myspace.js"></script>
<script src="tour.js?v=42"></script>
</body>
</html>
