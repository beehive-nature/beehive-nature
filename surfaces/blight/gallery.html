<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the Modern Inscription Art Gallery — a walking tour of on-chain art</title>
<style>
:root{--bg:#050508;--dim:#5a6478;--edge:#1a1a2a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:#cfe8d6;font:13px/1.5 'IBM Plex Mono',monospace;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:4vh 4vw 12vh}
#frame{max-width:min(62vh,86vw);max-height:66vh;transition:opacity .6s ease,transform .6s ease}
#frame.fade{opacity:0;transform:scale(.985)}
#frame svg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 42px rgba(0,229,255,.14))}
#plaque{position:fixed;left:0;right:0;bottom:58px;text-align:center;transition:opacity .5s ease;padding:0 16px}
#plaque .title{font-size:15px;color:#00E5FF;letter-spacing:.06em}
#plaque .sub{font-size:11px;color:var(--dim);margin-top:4px}
#plaque .sub b{color:#9FFF3D;font-weight:400}
.pips{letter-spacing:3px;color:#FFD700;font-size:12px}
.pips .off{color:#262638}
#hint{position:fixed;bottom:96px;left:0;right:0;text-align:center;font-size:15px;color:#7e8c85;
  letter-spacing:.4em;transition:opacity 1s ease;z-index:20}
#wing{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
.gold #frame svg{filter:drop-shadow(0 0 52px rgba(255,215,0,.28))}
#wing{position:fixed;top:18px;left:0;right:0;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.2em;text-transform:uppercase}
#controls{position:fixed;top:14px;right:16px;display:flex;gap:6px;z-index:30}
#controls button{background:#0d0d15cc;color:var(--dim);border:1px solid var(--edge);border-radius:5px;padding:5px 10px;cursor:pointer;font:11px ui-monospace,monospace}
#controls button:hover{color:#00E5FF;border-color:#00E5FF}
#controls button.on{color:#00FF41;border-color:#1d3a26}
#ask{position:fixed;bottom:56px;left:16px;right:16px;display:none;justify-content:center;z-index:40}
#ask div{display:flex;gap:6px;background:#0d0d15ee;border:1px solid var(--edge);border-radius:8px;padding:8px}
#ask input{background:#050508;color:#00E5FF;border:1px solid var(--edge);border-radius:5px;padding:7px 10px;font:12px ui-monospace,monospace;width:min(340px,60vw)}
#ask button{background:#0d0d15;color:#00FF41;border:1px solid var(--edge);border-radius:5px;padding:7px 12px;cursor:pointer;font:12px ui-monospace,monospace}
#dots{position:fixed;bottom:104px;left:0;right:0;display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:0 10px}
#dots i{width:5px;height:5px;border-radius:50%;background:#262638;cursor:pointer}
#dots i.here{background:#00E5FF;box-shadow:0 0 6px rgba(0,229,255,.7)}
#market{position:fixed;bottom:56px;right:16px;font-size:10px;color:var(--dim);z-index:30;text-decoration:none;border:1px solid var(--edge);border-radius:99px;padding:4px 10px;background:#0d0d15cc}
#market:hover{color:#9FFF3D;border-color:#9FFF3D}
</style>
</head>
<body>
<div id="wing">the founder's garden · base</div>
<div id="hint">▶ &nbsp;‹ › &nbsp;🔍 &nbsp;⌂</div>
<div id="stage"><div id="frame"></div></div>
<div id="dots"></div>
<div id="plaque"><div class="title">…</div><div class="sub">…</div></div>
<div id="controls">
  <button id="bPlay" class="on" title="the tour walks itself">▶ tour</button>
  <button id="bWings" title="collections as exhibits">⊞</button>
  <button id="bAsk" title="visit any wallet's collection">any wallet</button>
</div>
<div id="ask"><div><input id="addr" placeholder="0x… or name.base.eth"><button id="go">visit</button></div></div>
<a id="market" href="#" title="the DeMarketPlace docks here">⧉ market — docking soon</a>
<script>
/* The GALLERY: art first, one piece at a time, a walking tour. The tech lives in the
   explorer (its own surface, its own frequency); here only the piece, its name, its
   seed, its collection. Default wing: the founder's garden — bloverai.base.eth.
   All seven+ EVM ERC-20i families, fetched live, keyless, no keys no logins. */
const W=v=>BigInt(v).toString(16).padStart(64,'0');
const AD=a=>'0'.repeat(24)+a.replace(/^0x/,'').toLowerCase();
const HOSTS=['https://base-rpc.publicnode.com','https://base.drpc.org'];
const COLS=[
 {sym:'PEPI v2',c:'0x28a5e71BFc02723eAC17E39c84c5190415C0de9F',sel:'a435130b',lv:[0,11,22,33,44,56],base:1},
 {sym:'PEPI v1',c:'0x19706c142d33376240e418d6385f05691a5fa8e2',sel:'a435130b',lv:[0,11,22,33,44,56],base:1},
 {sym:'FUNGI',c:'0x7d9CE55D54FF3FEddb611fC63fF63ec01F26D15F',sel:'422b9e23',lv:[0,21000,525000,1050000,1575000,2100000],base:0},
 {sym:'$FROGGI',c:'0x88A78C5035BdC8C9A8bb5c029e6cfCDD14B822FE',sel:'422b9e23',lv:[0,1000,3000,10000,30000,60000,120000],base:0},
 {sym:'JELLI',c:'0xA1b9d812926a529D8B002E69FCd070c8275eC73c',sel:'422b9e23',lv:[0,1000,21000,105000,420000,1050000],base:0},
 {sym:'JEDI',c:'0xA058c6f2A56BaAFD5dE4BCAD8f2Cb26F6A32b7D1',sel:'422b9e23',lv:[0,10500,105000,1050000],base:0},
 {sym:'TRUFFI',c:'0x2496a9AF81A87eD0b17F6edEaf4Ac57671d24f38',sel:'a62f5b1b',lv:null,base:0},
 {sym:'MiDi',c:'0x569e1A337b095B1A6c8F206158072cEDb6325b56',sel:'422b9e23',lv:null,base:0},
];
function decodeString(hex){
  const h=hex.replace(/^0x/,'');
  const off=parseInt(h.slice(0,64),16);
  if(!(off===0x20)) throw 0;
  const len=parseInt(h.slice(off*2,off*2+64),16);
  if(!(len>=0&&len<=16384)) throw 0;
  let out='';
  for(let i=0;i<len;i++){
    const b=parseInt(h.slice((off+32+i)*2,(off+32+i)*2+2),16);
    if(Number.isNaN(b)) throw 0;
    out+=String.fromCharCode(b);
  }
  return out;
}
async function rpc(calls){
  for(const h of HOSTS){
    const ctl=new AbortController(); const kill=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(h,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
        body:JSON.stringify(calls.map((c,i)=>({jsonrpc:'2.0',id:i,method:'eth_call',params:[{to:c.to,data:c.data},'latest']})))});
      const j=await r.json(); clearTimeout(kill);
      if(Array.isArray(j)) return j.map(x=>x.result??null);
    }catch(e){ clearTimeout(kill); }
  }
  return null;
}
async function resolveName(v){
  if(/^0x[0-9a-fA-F]{40}$/.test(v)) return v.toLowerCase();
  try{
    const j=await (await fetch('https://api.base.domains/v1/'+encodeURIComponent(v),{headers:{'User-Agent':'gallery/1.0'}})).json();
    return (j&&j.address)?j.address.toLowerCase():null;
  }catch(e){ return null; }
}
let pieces=[],idx=0,walking=true,timer=null;
const lvlNum=(s,col)=>{ if(!col.lv) return null; let l=col.base; for(let i=1;i<col.lv.length;i++) if(s>=col.lv[i]) l++;
  return l-col.base; };
async function loadGarden(addr){
  const found=[];
  for(const col of COLS){
    const bal=await rpc([{to:col.c,data:'0x70a08231'+AD(addr)}]);
    if(!bal||!bal[0]||bal[0]==='0x'||BigInt(bal[0])<=0n) continue;
    // live seed = floor(balance); frozen records via holder index (up to 8)
    const seed=Number(BigInt(bal[0])/1000000000n);
    const calls=[{to:col.c,data:col.sel+W(seed)+W(0)+W(0)}];
    if(col.sel==='a62f5b1b') calls[0]={to:col.c,data:col.sel+W(seed)+W(0)+AD(addr)};
    const [mc]=await (async()=>{ const r=await rpc(['0x9c216508'+AD(addr)].map(d=>({to:col.c,data:d}))); return r; })();
    const n=mc&&mc!=='0x'?Number(BigInt(mc)):0;
    for(let i=0;i<Math.min(n,8);i++) calls.push({to:col.c,data:'0x0fd9587e'+AD(addr)+W(BigInt(i))});
    const res=await rpc(calls);
    if(res&&res[0]&&res[0]!=='0x'&&res[0].length>200){
      try{ found.push({svg:decodeString(res[0]),sym:col.sym,seed,lvln:lvlNum(seed,col),pipmax:col.lv?col.lv.length-1-col.base:0}); }catch(e){}
    }
    for(let i=1;i<res.length;i++){
      const rec=res[i];
      if(!rec||rec==='0x') continue;
      const w=(rec.replace(/^0x/,'').match(/.{64}/g)||[]).slice(0,3);
      if(w.length<2) continue;
      const s=BigInt('0x'+w[0]);
      const svgRes=await rpc([{to:col.c,data:col.sel+w.slice(0,col.sel==='a62f5b1b'?2:3).join('')+(col.sel==='a62f5b1b'?AD(addr):'')}]);
      if(svgRes&&svgRes[0]&&svgRes[0].length>200){
        try{ found.push({svg:decodeString(svgRes[0]),sym:col.sym,seed:Number(s),lvln:lvlNum(Number(s),col),pipmax:col.lv?col.lv.length-1-col.base:0}); }catch(e){}
      }
    }
  }
  // VALUE-FIRST CURATION, the dealer's order: highest level leads the tour, then the
  // rarer (bigger seed within its ladder). Gold light falls on top-level pieces.
  found.sort((a,b)=>{
    const la=a.lvln===null?-1:a.lvln, lb=b.lvln===null?-1:b.lvln;
    if(lb!==la) return lb-la;
    return (b.seed||0)-(a.seed||0);
  });
  return found;
}
window.__show=show;
function show(i){
  idx=(i+pieces.length)%pieces.length;
  const f=$('frame');
  f.classList.add('fade');
  setTimeout(()=>{
    const p=pieces[idx];
    f.innerHTML=p.svg;
    $('plaque').innerHTML='<div class="title">'+p.sym+'</div>'+
      '<div class="sub"><span class="pips">'+(p.lvln===null?'':pips(p.lvln,p.pipmax))+'</span> · <b>'+
      String(idx+1).padStart(2,'0')+' / '+pieces.length+'</b></div>';
    document.body.classList.toggle('gold',p.lvln!==null&&p.lvln===p.pipmax&&p.pipmax>0);
    [...$('dots').children].forEach((d,k)=>d.classList.toggle('here',k===idx));
    f.classList.remove('fade');
  },420);
}
function walk(){ if(!walking||!pieces.length) return; show(idx+1); }
async function start(addr,wing){
  $('plaque').innerHTML='<div class="title" style="color:var(--dim)">walking the gallery…</div><div class="sub">reading the chain</div>';
  $('frame').innerHTML='';
  pieces=await loadGarden(addr);
  $('wing').textContent=wing;
  if(!pieces.length){
    $('plaque').innerHTML='<div class="title" style="color:#e8b84a">this garden is quiet — no live inscriptions found</div><div class="sub">try bloverai.base.eth, or any 0x… address</div>';
    return;
  }
  $('dots').innerHTML=pieces.map((_,k)=>'<i data-k="'+k+'"></i>').join('');
  [...$('dots').children].forEach(d=>d.onclick=()=>show(+d.dataset.k));
  window.__garden=pieces;
  if(window.__wingsRefresh) window.__wingsRefresh();
  show(0);
  if(walking&&timer) clearInterval(timer);
  timer=setInterval(walk,6000);
}
const pips=(n,max)=>{max=Math.max(max,1);let s='';for(let k=0;k<max;k++)s+=k<n?'●':'<span class=\"off\">●</span>';return s;};
const $=id=>document.getElementById(id);
const hideHint=()=>{const hh=document.getElementById('hint');if(hh){hh.style.opacity=0;setTimeout(()=>hh.remove(),1100);}};
document.addEventListener('click',hideHint);
document.addEventListener('keydown',hideHint);
$('bPlay').onclick=()=>{ walking=!walking; $('bPlay').textContent=walking?'▶ tour':'❚❚ paused'; $('bPlay').classList.toggle('on',walking); };
$('bAsk').onclick=()=>{ const a=$('ask'); a.style.display=a.style.display==='flex'?'none':'flex'; $('addr').focus(); };
$('go').onclick=async()=>{ const v=$('addr').value.trim(); if(!v) return;
  const a=await resolveName(v);
  if(!a){ $('addr').style.borderColor='#e8b84a'; return; }
  $('addr').style.borderColor='';
  start(a,(v||a.slice(0,10)+'…')+' · garden'); };
$('addr').addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show(idx+1);
  if(e.key==='ArrowLeft') show(idx-1);
  if(e.key===' '){ e.preventDefault(); $('bPlay').click(); }
});
start('0xfbd201472d5a439f1f0e408eb5dfaf6ea3687876',"the founder's garden · base");
</script>
<div id="wings" style="position:fixed;inset:0;background:#050508f5;z-index:60;display:none;overflow-y:auto;padding:70px 4vw 90px"><div id="wingsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;max-width:1100px;margin:0 auto"></div><div id="roomBack" style="display:none;max-width:1100px;margin:0 auto"></div></div><script>
/* WINGS: every collection its own exhibit; every exhibit opens a room with the
   full-stack facts (source-verified in the catalog lane). Icon-first, value-first. */
var FACTS={
 'PEPI v2':{sup:'13,370',lad:'11·22·33·44·56 (top 0.42%)',art:'anon 0x1609e546… · lifecycle art, traits in SVG',pool:'Uni v3 PEPI/WETH 1%'},
 'PEPI v1':{sup:'13,370',lad:'11·22·33·44·56',art:'same anon creator · the o/u era',pool:'Uni v3'},
 'FUNGI':{sup:'210,000,000',lad:'21k·525k·1.05M·1.575M·2.1M (top 1%)',art:'ToddStool · on-chain trait JSON · spore→mushroom',pool:'Uni v3 ~$35k'},
 '$FROGGI':{sup:'76,740,000',lad:'1k·3k·10k·30k·60k·120k (top 0.16%)',art:'animated egg→body · expressions',pool:'—'},
 'JELLI':{sup:'210,000,000',lad:'1k·21k·105k·420k·1.05M (top 0.5%)',art:'underwater scenes · mirrorTime',pool:'—'},
 'JEDI':{sup:'210,000,000',lad:'10.5k·105k·1.05M (top 0.5%)',art:'lightsabers · site jedi.army dead',pool:'none — no DEX pair'},
 'TRUFFI':{sup:'15,000,000',lad:'? — source pending',art:'art keyed to the HOLDER',pool:'—'},
 'MiDi':{sup:'210,000,000',lad:'music: scale·duration·bars',art:'the fallen youngest · lived May–Jun 2024',pool:'none'},
};
var _w=function(id){return document.getElementById(id);};
function openWings(){
  _w('wings').style.display='block'; _w('wingsGrid').style.display='grid'; _w('roomBack').style.display='none';
  var g=window.__garden||[], by={};
  g.forEach(function(p){ (by[p.sym]=by[p.sym]||[]).push(p); });
  Object.keys(by).forEach(function(k){ by[k].sort(function(x,y){return (y.lvln===null?-1:y.lvln)-(x.lvln===null?-1:x.lvln)||(y.seed||0)-(x.seed||0);}); });
  var grid=_w('wingsGrid'); grid.innerHTML='';
  Object.keys(by).forEach(function(sym){
    var list=by[sym]; var f=list[0]; if(!f) return;
    var card=document.createElement('div');
    card.style.cssText='background:#0d0d15;border:1px solid #1a1a2a;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s';
    card.onmouseover=function(){card.style.transform='translateY(-3px)';card.style.borderColor='#00E5FF';};
    card.onmouseout=function(){card.style.transform='';card.style.borderColor='#1a1a2a';};
    var th=document.createElement('div'); th.style.cssText='background:#000;padding:10px;display:flex;justify-content:center';
    th.innerHTML=f.svg; var sv=th.querySelector('svg'); if(sv){sv.style.width='120px';sv.style.height='120px';}
    card.appendChild(th);
    var lab=document.createElement('div'); lab.style.cssText='padding:10px 12px';
    var l1=document.createElement('div'); l1.style.cssText='color:#00E5FF;font-size:13px'; l1.textContent=sym;
    var l2=document.createElement('div'); l2.style.cssText='color:#5a6478;font-size:10.5px;margin-top:3px';
    l2.textContent=list.length+' piece'+(list.length>1?'s':'')+' · best '+((f.lvln!==null&&f.pipmax)?('L'+f.lvln+'/'+f.pipmax):'?');
    lab.appendChild(l1); lab.appendChild(l2); card.appendChild(lab);
    card.onclick=function(){openRoom(sym,list);};
    grid.appendChild(card);
  });
  if(!grid.children.length){ var e=document.createElement('div'); e.style.color='#5a6478';
    e.textContent='no exhibits yet — visit a wallet first (any wallet button)'; grid.appendChild(e); }
}
function openRoom(sym,list){
  _w('wingsGrid').style.display='none'; _w('roomBack').style.display='block';
  var F=FACTS[sym]||{}; var rb=_w('roomBack'); rb.innerHTML='';
  var head=document.createElement('div'); head.style.cssText='overflow:hidden';
  var t=document.createElement('div'); t.style.cssText='color:#00E5FF;font-size:17px;float:left'; t.textContent=sym;
  var back=document.createElement('button'); back.textContent='⌂ wings';
  back.style.cssText='float:right;background:#0d0d15;color:#5a6478;border:1px solid #1a1a2a;border-radius:5px;padding:5px 10px;cursor:pointer;font:11px ui-monospace,monospace';
  back.onclick=openWings;
  head.appendChild(t); head.appendChild(back); rb.appendChild(head);
  var sub=document.createElement('div'); sub.style.cssText='color:#5a6478;font-size:11px;margin:8px 0 14px;line-height:1.8';
  sub.textContent=['supply '+(F.sup||'?'),'ladder '+(F.lad||'?'),F.art||'','pool '+(F.pool||'?')].filter(Boolean).join(' · ');
  rb.appendChild(sub);
  var wall=document.createElement('div');
  wall.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px';
  list.forEach(function(p){
    var c=document.createElement('div');
    c.style.cssText='background:#0d0d15;border:1px solid #1a1a2a;border-radius:8px;overflow:hidden;cursor:pointer;text-align:center';
    var th=document.createElement('div'); th.style.cssText='background:#000;padding:8px'; th.innerHTML=p.svg;
    var sv=th.querySelector('svg'); if(sv){sv.style.width='100%';sv.style.height='auto';}
    var l=document.createElement('div'); l.style.cssText='padding:6px;color:#5a6478;font-size:10px';
    l.textContent='seed '+(p.seed||0).toLocaleString()+((p.lvln!==null&&p.pipmax)?(' · L'+p.lvln):'');
    c.appendChild(th); c.appendChild(l);
    c.onclick=function(){ closeWings(); var i=(window.__garden||[]).indexOf(p); if(i>-1&&window.__show) window.__show(i); };
    wall.appendChild(c);
  });
  rb.appendChild(wall);
}
function closeWings(){ _w('wings').style.display='none'; }
document.getElementById('bWings').onclick=function(){ var w=_w('wings');
  if(w.style.display==='block'){ closeWings(); } else { openWings(); } };
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeWings(); });

</script>
</body>
</html>
