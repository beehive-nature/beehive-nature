<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>the Modern Inscription Art Gallery — a walking tour of on-chain art</title>
<style>
:root{--bg:#050508;--dim:#5a6478;--edge:#1a1a2a}
*{margin:0;padding:0;box-sizing:border-box}
/* THE OVERHAUL (founder, 2026-08-21: the mobile chrome was five position:fixed layers
   guessing at each other's coordinates — title under buttons, hint glyphs on the pager,
   the market chip on the plaque. Rebuilt as ONE flex column: top bar, stage, deck.
   In-flow elements cannot collide, at any width, by construction. And every control
   moved to the bottom deck where thumbs actually are — the A16 law applied to layout,
   with ≥40px tap targets and real prev/next buttons instead of keyboard-hint glyphs. */
html,body{height:100%}
body{background:var(--bg);color:#cfe8d6;font:13px/1.5 'IBM Plex Mono',monospace;overflow:hidden;
  height:100dvh;display:flex;flex-direction:column}
#topbar{flex:0 0 auto;padding:12px 14px 6px;text-align:center;font-size:11px;color:var(--dim);
  letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
  padding:2vh 4vw;touch-action:pan-y}
#frame{max-width:min(62vh,86vw);max-height:100%;transition:opacity .6s ease,transform .6s ease}
#frame.fade{opacity:0;transform:scale(.985)}
#frame svg{width:100%;height:auto;max-height:100%;display:block;filter:drop-shadow(0 0 42px rgba(0,229,255,.14))}
.gold #frame svg{filter:drop-shadow(0 0 52px rgba(255,215,0,.28))}
#deck{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:4px 10px 10px}
#dots{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;max-width:92vw}
#dots i{width:6px;height:6px;border-radius:50%;background:#262638;cursor:pointer;padding:2px;background-clip:content-box}
#dots i.here{background:#00E5FF;background-clip:content-box;box-shadow:0 0 6px rgba(0,229,255,.7)}
#plaque{text-align:center;transition:opacity .5s ease;padding:0 12px;min-height:34px}
#plaque .title{font-size:15px;color:#00E5FF;letter-spacing:.06em}
#plaque .sub{font-size:11px;color:var(--dim);margin-top:3px}
#plaque .sub b{color:#9FFF3D;font-weight:400}
.pips{letter-spacing:3px;color:#FFD700;font-size:12px}
.pips .off{color:#262638}
#actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:stretch}
#actions button,#actions a{background:#0d0d15cc;color:var(--dim);border:1px solid var(--edge);
  border-radius:8px;min-height:40px;min-width:44px;padding:8px 12px;cursor:pointer;
  font:12px ui-monospace,monospace;display:inline-flex;align-items:center;justify-content:center;
  text-decoration:none;line-height:1}
#actions button:hover,#actions a:hover{color:#00E5FF;border-color:#00E5FF}
#actions button.on{color:#00FF41;border-color:#1d3a26}
#ask{display:none;justify-content:center;width:100%}
#ask div{display:flex;gap:6px;background:#0d0d15ee;border:1px solid var(--edge);border-radius:8px;
  padding:8px;width:100%;max-width:440px}
#ask input{flex:1;min-width:0;background:#050508;color:#00E5FF;border:1px solid var(--edge);
  border-radius:5px;padding:9px 10px;font:12px ui-monospace,monospace}
#ask button{background:#0d0d15;color:#00FF41;border:1px solid var(--edge);border-radius:5px;
  padding:9px 14px;cursor:pointer;font:12px ui-monospace,monospace;min-height:40px}
</style>
</head>
<body>
<div id="topbar"><span id="wing">the founder's garden · base</span></div>
<div id="stage"><div id="frame"></div></div>
<div id="deck">
  <div id="dots"></div>
  <div id="plaque"><div class="title">…</div><div class="sub">…</div></div>
  <div id="ask"><div><input id="addr" placeholder="0x… or name.base.eth"><button id="go">visit</button></div></div>
  <div id="actions">
    <button id="bPrev" title="previous piece" aria-label="previous piece">‹</button>
    <button id="bPlay" class="on" title="the tour walks itself">▶ tour</button>
    <button id="bNext" title="next piece" aria-label="next piece">›</button>
    <button id="bWings" title="collections as exhibits">⊞ <span data-i18n="act.wings">wings</span></button>
    <button id="bAsk" title="visit any wallet's collection"><span data-i18n="act.wallet">any wallet</span></button>
    <a id="market" href="#" title="the DeMarketPlace docks here">⧉ <span data-i18n="act.market">market</span></a>
  </div>
</div>
<script>
/* The GALLERY: art first, one piece at a time, a walking tour. The tech lives in the
   explorer (its own surface, its own frequency); here only the piece, its name, its
   seed, its collection. Default wing: the founder's garden — bloverai.base.eth.   All seven+ EVM ERC-20i families, fetched live, keyless, no keys no logins. */
const W=v=>BigInt(v).toString(16).padStart(64,'0');
const AD=a=>'0'.repeat(24)+a.replace(/^0x/,'').toLowerCase();
/* multi-chain: each collection names its chain; the family began on Base (Fungi,
   2024-03-31, the first ERC-20i) and Pepi expanded to Ethereum 2026-03-03 — same
   operator wallet, byte-identical generator (receipted via Sourcify). */
const CHAINS={
  base:['https://base-rpc.publicnode.com','https://base.drpc.org'],
  eth:['https://ethereum-rpc.publicnode.com','https://eth.drpc.org']
};
const H=col=>CHAINS[col.ch||'base'];
const COLS=[
 /* deg/cnt/idx = each collection's own dialect (ABI census 2026-08-27):
    FUNGI + PEPI speak sporesDegree + mushroom*, JELLI polypsDegree + medusa*,
    FROGGI/JEDI/TRUFFI dynamicInscription + inscription*; MiDi is the cassette
    model — balance-derived, no degree. PEPI eth lives on mainnet endpoints. */
 {sym:'PEPI v2',c:'0x28a5e71BFc02723eAC17E39c84c5190415C0de9F',sel:'a435130b',deg:'a775188a',cnt:'9c216508',idx:'0fd9587e',lv:[0,11,22,33,44,56],base:1},
 {sym:'PEPI eth',c:'0x3103cD1602d5fa8f4b9283F9D5a7fa2290795d51',sel:'a435130b',deg:null,cnt:'9c216508',idx:'0fd9587e',lv:[0,11,22,33,44,56],base:1,ch:'eth'},
 {sym:'PEPI v1',c:'0x19706c142d33376240e418d6385f05691a5fa8e2',sel:'a435130b',deg:'a775188a',cnt:'9c216508',idx:'0fd9587e',lv:[0,11,22,33,44,56],base:1},
 {sym:'FUNGI',c:'0x7d9CE55D54FF3FEddb611fC63fF63ec01F26D15F',sel:'422b9e23',deg:'a775188a',cnt:'9c216508',idx:'0fd9587e',lv:[0,21000,525000,1050000,1575000,2100000],base:0},
 {sym:'$FROGGI',c:'0x88A78C5035BdC8C9A8bb5c029e6cfCDD14B822FE',sel:'422b9e23',deg:'2bd1a011',cnt:'fb700e5b',idx:'c7218d5b',lv:[0,1000,3000,10000,30000,60000,120000],base:0},
 {sym:'JELLI',c:'0xA1b9d812926a529D8B002E69FCd070c8275eC73c',sel:'422b9e23',deg:'68b77feb',cnt:'3ebccc57',idx:'e5100df8',lv:[0,1000,21000,105000,420000,1050000],base:0},
 {sym:'JEDI',c:'0xA058c6f2A56BaAFD5dE4BCAD8f2Cb26F6A32b7D1',sel:'422b9e23',deg:'2bd1a011',cnt:'fb700e5b',idx:'c7218d5b',lv:[0,10500,105000,1050000],base:0},
 {sym:'TRUFFI',c:'0x2496a9AF81A87eD0b17F6edEaf4Ac57671d24f38',sel:'a62f5b1b',deg:'2bd1a011',cnt:'fb700e5b',idx:'c7218d5b',lv:null,base:0},
 {sym:'MiDi',c:'0x569e1A337b095B1A6c8F206158072cEDb6325b56',sel:'422b9e23',deg:null,cnt:'9c216508',idx:'0fd9587e',lv:null,base:0},
];
/* the fidelity law: a record's OWN words ARE the getSvg tuple — feed verbatim */
/* SeedData is a STATIC struct — its fields encode back to back with NO
   leading dynamic-offset word. The W(0x20) that used to sit here shifted
   every field over by one, so the contract read seed=32 and RandLib.lvl()
   returned the LOWEST tier for every piece in this gallery. Proven live
   2026-08-29 against each contract's own getMeta: with the offset, FUNGI /
   $FROGGI / JELLI all reported level 0 and PEPI v2 level 3; without it, 5 / 6
   / 5 / 6 — matching level-truth.js's ladder exactly. Same root cause as
   founder eye-catch #6; this surface kept its own copy and so kept the bug. */
function recArt(col,w){return col.sel+w.slice(0,col.sel==='a435130b'?3:2).join('')}  /* PEPI (a435130b) is the 3-field struct {seed,seed2,extra}; the rest are {seed,extra} */
function decodeString(hex){
  const h=hex.replace(/^0x/,'');
  const off=parseInt(h.slice(0,64),16);
  if(!(off===0x20)) throw 0;
  const len=parseInt(h.slice(off*2,off*2+64),16);
  /* cap raised 16 KB -> 128 KB, matching level-truth.js. $FROGGI's real
     level-6 art measured 53,783 bytes live for the founder's garden (and
     71,293 at the top rung) — the old cap threw, the call site caught and
     skipped, and the piece vanished from the tour with no message. */
  if(!(len>=0&&len<=131072)) throw 0;
  let out='';
  for(let i=0;i<len;i++){
    const b=parseInt(h.slice((off+32+i)*2,(off+32+i)*2+2),16);
    if(Number.isNaN(b)) throw 0;
    out+=String.fromCharCode(b);
  }
  return out;
}
async function rpc(calls,hosts){
  for(const h of (hosts||CHAINS.base)){
    const ctl=new AbortController(); const kill=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(h,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
        body:JSON.stringify(calls.map((c,i)=>({jsonrpc:'2.0',id:i,method:'eth_call',params:[{to:c.to,data:c.data},'latest']})))});
      const j=await r.json(); clearTimeout(kill);
      if(Array.isArray(j)) return j.map(x=>x.result??null);
    }catch(e){ clearTimeout(kill); }
  }
  return null;
}
async function resolveName(v){
  if(/^0x[0-9a-fA-F]{40}$/.test(v)) return v.toLowerCase();
  // API first, then the on-chain registry walk (owner -> resolver -> addr) —
  // api.base.domains is TLS-unreachable from some networks, and the default
  // wing must never go quiet just because one endpoint did. Same path the
  // profile and explorer surfaces carry.
  try{
    const j=await (await fetch('https://api.base.domains/v1/'+encodeURIComponent(v),{headers:{'User-Agent':'gallery/1.0'}})).json();
    if(j&&j.address) return j.address.toLowerCase();
  }catch(e){}
  try{ return await resolveOnChain(v); }catch(e){ return null; }
}
/* on-chain name resolution — registry eth_calls only, zero extra origins */
const RC=[1n,0x8082n,0x800000000000808an,0x8000000080008000n,0x808bn,0x80000001n,0x8000000080008081n,0x8000000000008009n,0x8an,0x88n,0x80008009n,0x8000000an,0x8000808bn,0x800000000000008bn,0x8000000000008089n,0x8000000000008003n,0x8000000000008002n,0x8000000000000080n,0x800an,0x800000008000000an,0x8000000080008081n,0x8000000000008080n,0x80000001n,0x8000000080008008n];
const KROT=[[0,36,3,41,18],[1,44,10,45,2],[62,6,43,15,61],[28,55,25,21,56],[27,20,39,8,14]];
const M64=(1n<<64n)-1n;
function keccak256(bytes){
  const rot=(x,n)=>n===0n?x:((x<<n)|(x>>(64n-n)))&M64;
  let A=Array.from({length:5},()=>[0n,0n,0n,0n,0n]);
  const rate=136,pad=rate-(bytes.length%rate);
  const msg=new Uint8Array(bytes.length+pad);
  msg.set(bytes);msg[bytes.length]=0x01;msg[msg.length-1]|=0x80;
  for(let off=0;off<msg.length;off+=rate){
    for(let i=0;i<17;i++){let l=0n;for(let b=7;b>=0;b--)l=(l<<8n)|BigInt(msg[off+i*8+b]);A[i%5][(i/5)|0]^=l;}
    for(let r=0;r<24;r++){
      const C=[0,1,2,3,4].map(x=>A[x][0]^A[x][1]^A[x][2]^A[x][3]^A[x][4]);
      const D=[0,1,2,3,4].map(x=>C[(x+4)%5]^rot(C[(x+1)%5],1n));
      for(let x=0;x<5;x++)for(let y=0;y<5;y++)A[x][y]^=D[x];
      const B=[[],[],[],[],[]];
      for(let x=0;x<5;x++)for(let y=0;y<5;y++)B[y][(2*x+3*y)%5]=rot(A[x][y],BigInt(KROT[x][y]));
      for(let x=0;x<5;x++)for(let y=0;y<5;y++)A[x][y]=B[x][y]^((~B[(x+1)%5][y]&M64)&B[(x+2)%5][y]);
      A[0][0]^=RC[r];
    }
  }
  const out=new Uint8Array(32);let p=0;
  for(let i=0;i<4;i++){let l=A[i%5][(i/5)|0];for(let b=0;b<8;b++)out[p++]=Number((l>>BigInt(8*b))&0xFFn);}
  return out;
}
function namehash(name){
  let node=new Uint8Array(32);
  if(name){
    const L=name.split('.');
    for(let i=L.length-1;i>=0;i--){
      const lh=keccak256(new TextEncoder().encode(L[i]));
      const cat=new Uint8Array(64);cat.set(node);cat.set(lh,32);
      node=keccak256(cat);
    }
  }
  return '0x'+[...node].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function resolveOnChain(name){
  const isBase=/\.base\.eth$/i.test(name);
  const REG=isBase?'0xB94704422c2a1E396835A571837Aa5AE53285a95':'0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e';
  const node=namehash(name.toLowerCase()).slice(2);
  const call=async(to,data)=>{const r=await rpc([{to,data}]);return r&&r[0]&&r[0]!=='0x'?r[0]:null};
  const own=await call(REG,'0x02571be3'+node);
  if(!own||/^0x0*$/.test(own))return null;
  const rs=await call(REG,'0x0178b8bf'+node);
  if(!rs||/^0x0*$/.test(rs))return null;
  const a=await call('0x'+rs.slice(26),'0x3b3b57de'+node);
  return a&&!/^0x0*$/.test(a)?'0x'+a.slice(26).toLowerCase():null;
}
let pieces=[],idx=0,walking=true,timer=null;
const lvlNum=(s,col)=>{ if(!col.lv) return null; let l=col.base; for(let i=1;i<col.lv.length;i++) if(s>=col.lv[i]) l++;
  return l-col.base; };
async function loadGarden(addr){
  const found=[];
  window.__rawPieces=[];
  for(const col of COLS){
    const bal=await rpc([{to:col.c,data:'0x70a08231'+AD(addr)}]);
    if(!bal||!bal[0]||bal[0]==='0x'||BigInt(bal[0])<=0n) continue;
    // the account's DEGREE inscription is the live piece — the record the
    // ecosystem renders, not a balance-derived approximation; frozen records
    // follow via the collection's own enumeration dialect (up to 8)
    const seed=Number(BigInt(bal[0])/1000000000n);
    const calls=[col.deg
      ?{to:col.c,data:'0x'+col.deg+AD(addr)}
      :{to:col.c,data:col.sel+W(seed)+W(0)+(col.sel==='a62f5b1b'?AD(addr):'')}];   // no offset word — see recArt
    const mcRes=await rpc(['0x'+col.cnt+AD(addr)].map(d=>({to:col.c,data:d})),H(col));
    const mc=mcRes&&mcRes[0];
    const n=mc&&mc!=='0x'?Number(BigInt(mc)):0;
    for(let i=0;i<Math.min(n,8);i++) calls.push({to:col.c,data:'0x'+col.idx+AD(addr)+W(BigInt(i))});
    const res=await rpc(calls,H(col));
    if(res&&res[0]&&res[0]!=='0x'){
      if(res[0].length<=202){
        const w=(res[0].replace(/^0x/,'').match(/.{64}/g)||[]);
        if(w.length>=2){
          const s=Number(BigInt('0x'+w[0]));
          const art=await rpc([{to:col.c,data:recArt(col,w)}],H(col));
          if(art&&art[0]&&art[0].length>200){
            try{const svg=decodeString(art[0]);found.push({svg,sym:col.sym,seed:s,lvln:lvlNum(s,col),pipmax:col.lv?col.lv.length-1-col.base:0});window.__rawPieces.push({sym:col.sym,svg});}catch(e){}
          }
        }
      }else if(res[0].length>200){
        try{const svg=decodeString(res[0]);found.push({svg,sym:col.sym,seed,lvln:lvlNum(seed,col),pipmax:col.lv?col.lv.length-1-col.base:0});window.__rawPieces.push({sym:col.sym,svg});}catch(e){}
      }
    }
    for(let i=1;res&&i<res.length;i++){
      const rec=res[i];
      if(!rec||rec==='0x') continue;
      const w=(rec.replace(/^0x/,'').match(/.{64}/g)||[]).slice(0,3);
      if(w.length<2) continue;
      const s=BigInt('0x'+w[0]);
      const svgRes=await rpc([{to:col.c,data:recArt(col,w)}],H(col));
      if(svgRes&&svgRes[0]&&svgRes[0].length>200){
        try{const svg=decodeString(svgRes[0]);found.push({svg,sym:col.sym,seed:Number(s),lvln:lvlNum(Number(s),col),pipmax:col.lv?col.lv.length-1-col.base:0});window.__rawPieces.push({sym:col.sym,svg});}catch(e){}
      }
    }
  }
  // VALUE-FIRST CURATION, the dealer's order: highest level leads the tour, then the
  // rarer (bigger seed within its ladder). Gold light falls on top-level pieces.
  found.sort((a,b)=>{
    const la=a.lvln===null?-1:a.lvln, lb=b.lvln===null?-1:b.lvln;
    if(lb!==la) return lb-la;
    return (b.seed||0)-(a.seed||0);
  });
  return found;
}
window.__show=show;
function show(i){
  idx=(i+pieces.length)%pieces.length;
  const f=$('frame');
  f.classList.add('fade');
  setTimeout(()=>{
    const p=pieces[idx];
    f.innerHTML=p.svg;
    $('plaque').innerHTML='<div class="title">'+p.sym+'</div>'+
      '<div class="sub"><span class="pips">'+(p.lvln===null?'':pips(p.lvln,p.pipmax))+'</span> · <b>'+
      String(idx+1).padStart(2,'0')+' / '+pieces.length+'</b></div>';
    document.body.classList.toggle('gold',p.lvln!==null&&p.lvln===p.pipmax&&p.pipmax>0);
    [...$('dots').children].forEach((d,k)=>d.classList.toggle('here',k===idx));
    f.classList.remove('fade');
  },420);
}
function walk(){ if(!walking||!pieces.length) return; show(idx+1); }
async function start(addr,wing){
  addr=await resolveName(addr)||addr; // names resolve here so every caller can pass either form
  $('plaque').innerHTML='<div class="title" style="color:var(--dim)">walking the gallery…</div><div class="sub">reading the chain</div>';
  $('frame').innerHTML='';
  let got;
  try{ got=await loadGarden(addr); }
  catch(e){
    $('plaque').innerHTML='<div class="title" style="color:#e8b84a">the chain didn&#39;t answer — try again in a moment</div><div class="sub">every read is live; nothing here is faked</div>';
    return;
  }
  pieces=got;
  $('wing').textContent=wing;
  if(!pieces.length){
    $('plaque').innerHTML='<div class="title" style="color:#e8b84a">this garden is quiet — no live inscriptions found</div><div class="sub">try bloverai.base.eth, or any 0x… address</div>';
    return;
  }
  $('dots').innerHTML=pieces.map((_,k)=>'<i data-k="'+k+'"></i>').join('');
  [...$('dots').children].forEach(d=>d.onclick=()=>show(+d.dataset.k));
  window.__garden=pieces;
  if(window.__wingsRefresh) window.__wingsRefresh();
  show(0);
  if(walking&&timer) clearInterval(timer);
  timer=setInterval(walk,6000);
}
const pips=(n,max)=>{max=Math.max(max,1);let s='';for(let k=0;k<max;k++)s+=k<n?'●':'<span class=\"off\">●</span>';return s;};
const $=id=>document.getElementById(id);
$('bPlay').onclick=()=>{ walking=!walking; $('bPlay').textContent=walking?'▶ tour':'❚❚ paused'; $('bPlay').classList.toggle('on',walking); };
$('bPrev').onclick=()=>show(idx-1);
$('bNext').onclick=()=>show(idx+1);
/* swipe — the stage answers thumbs, not just keys */
(function(){ let x0=null,y0=null;
  const st=$('stage');
  st.addEventListener('touchstart',e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  st.addEventListener('touchend',e=>{ if(x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=y0=null;
    if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.5) show(idx+(dx<0?1:-1));
  },{passive:true});
})();
$('bAsk').onclick=()=>{ const a=$('ask'); a.style.display=a.style.display==='flex'?'none':'flex'; $('addr').focus(); };
$('go').onclick=async()=>{ const v=$('addr').value.trim(); if(!v) return;
  const a=await resolveName(v);
  if(!a){ $('addr').style.borderColor='#e8b84a'; return; }
  $('addr').style.borderColor='';
  start(a,(v||a.slice(0,10)+'…')+' · garden'); };
$('addr').addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') show(idx+1);
  if(e.key==='ArrowLeft') show(idx-1);
  if(e.key===' '){ e.preventDefault(); $('bPlay').click(); }
});
