[package]
name = "genealogy-publication"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Content-addressed publication seal for the staged genealogy corpus: deterministic bind, drift check, machine index, and .b/bnr-canonical resolution records over the estate rails. Artifacts only — no network; fetching belongs to the dApp and the adapters."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bnr-url = { path = "../bnr-url" }
