[package]
name = "bpay-sign"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The bPay Phase-E signing cockpit service: binds the founder authorization to the wave plan (watchpay::wave), composes and signs through the injected transport, verifies every device/hot result through the wall, persists exactly one receipt per authorization, and — on the founder-ordered TESTNET ledger only — settles the two signed transactions for the pipeline proof. Mainnet settlement does not exist in this binary."

[dependencies]
watchpay = { path = "../watchpay" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
ureq = { version = "2", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc", "arithmetic"] }
alloy-rlp = "0.3"

[dev-dependencies]
hex = "0.4"
