[package]
name = "harness-sovereign"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Kill-the-Model-Keep-the-Agent demo harness as a kernel citizen: model backends as sense adapters, checkpoints as bus events, bSigner linked as a library"

[dependencies]
event-bus = { path = "../event-bus" }
shared-types = { path = "../shared-types" }
bsigner = { path = "../bsigner" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7" }
futures-util = "0.3"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
secp256k1 = { version = "0.29", features = ["global-context"] }
tokio-tungstenite = "0.29"
base64 = "0.22"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
