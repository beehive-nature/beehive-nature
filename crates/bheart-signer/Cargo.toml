[package]
name = "bheart-signer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "bHEartWALLet's DECIDING organ — identity + post-quantum keys (ML-DSA signatures, ML-KEM), signs on-device, keys never leave, never printed. CRYPTO-AGILITY LAW: every signature and hash carries an algorithm identifier; nothing hardcoded. NOTE: distinct from crates/bsigner (the C1 Trezor scaffold that cannot sign) — fences there are untouched."

# BINDING LAW (anchor-daemon lane): this crate NEVER depends on banchor.
# The wallet works fully with the anchor off — accelerator, never a gate.
# There is deliberately no `banchor` line in this manifest, and there never
# will be one while this law stands.
[dependencies]
ml-dsa = { version = "0.1", features = ["getrandom", "zeroize"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = { workspace = true }
zeroize = { workspace = true }
thiserror = "2"
