# bTunGsTeN Quantum Circuit Evaluator & Reversible GF(16) Synthesizer
# Independent evaluator, reference arithmetic, gate stream validation, and sabotage battery.
[package]
name = "btungsten-qeval"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
btungsten-wb001 = { path = "../btungsten-wb001" }
btungsten-wb001-core = { path = "../btungsten-wb001-core" }
