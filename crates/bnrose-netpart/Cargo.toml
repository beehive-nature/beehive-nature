version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "BNROSE-NETPART-001: the reproducible two-host partition harness with an independent destination — delayed requests, lost acknowledgements, competing recovery, duplicate delivery, reconciliation. Local safety, destination execution, and finality are distinguished, never conflated."
