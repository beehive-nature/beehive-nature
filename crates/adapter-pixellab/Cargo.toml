[package]
name = "adapter-pixellab"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "MCP server bridging the Studio's narrow art contract (prompt + style anchor + layer name -> PNG with alpha) to PixelLab. Key from file, balance-gated in USD, zero-spend tests."

# Native binary (stdio MCP child of buzz). Unlike inscription-gate this does I/O,
# so it is not WASM — it is the LaunchPad-side counterpart to the browser gate.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
