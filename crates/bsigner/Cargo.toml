[package]
name = "bsigner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "bSigner — bHEartWALLet's DECIDING organ (canon name per Seat-1 naming ruling 2026-09-03): identity + post-quantum keys (ML-DSA signatures, ML-KEM), signs on-device, keys never leave, never printed. CRYPTO-AGILITY LAW: every signature and hash carries an algorithm identifier; nothing hardcoded. crates/btrezor (the C1 Trezor scaffold that cannot sign) is intended to become a BACKEND of this organ, behind the same interface — not a permanent sibling."

# BINDING LAW (anchor-daemon lane): this crate NEVER depends on banchor.
# The wallet works fully with the anchor off — accelerator, never a gate.
# There is deliberately no `banchor` line in this manifest, and there never
# will be one while this law stands.
[dependencies]
ml-dsa = { version = "0.1", features = ["getrandom", "zeroize"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = { workspace = true }
zeroize = { workspace = true }
thiserror = "2"
# bpq.rs (the Rust twin of surfaces/bpq.js): X-Wing's X25519 half, HKDF and
# AES-256-GCM for sealed objects, bech32m for the bzpq1 id.
aes-gcm = "0.10"
# OS entropy for the file key and oid of a sealed key file (keys.rs, bpq::seal_self)
getrandom = "0.2"
# SLH-DSA-SHAKE-256f (FIPS 205), the succession key of SPEC-BPQ-1 §2 and §5.
# integritychain fips205 0.4.1 passed every ACVP case for this parameter set
# (crates/btungsten-pq, PQ01); only this set is compiled in.
fips205 = { version = "=0.4.1", default-features = false, features = ["default-rng", "slh_dsa_shake_256f"] }
bech32 = "0.9"
# the SAW-proven derivation byte layer (SPEC-BTUNGSTEN-PQ-1 PQ03): every HKDF
# info string bpq.rs derives a key from is built by bpq-core
bpq-core = { path = "../bpq-core" }
hkdf = "0.12"
sha2 = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# taproot.rs (SPEC-BTUNGSTEN-PQ-1 PQ12): the BIP-341 tweak and the BIP-340
# check of a key-path witness. The same pin btungsten-pq's classical KAT runs
# (1,485 of 1,485 BIP-340 and Wycheproof cases, PQ11).
k256 = { version = "=0.13.4", features = ["schnorr", "arithmetic"] }
