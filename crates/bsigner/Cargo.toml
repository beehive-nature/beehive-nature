[package]
name = "bsigner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "bSigner — bHEartWALLet's DECIDING organ (canon name per Seat-1 naming ruling 2026-09-03): identity + post-quantum keys (ML-DSA signatures, ML-KEM), signs on-device, keys never leave, never printed. CRYPTO-AGILITY LAW: every signature and hash carries an algorithm identifier; nothing hardcoded. crates/btrezor (the C1 Trezor scaffold that cannot sign) is intended to become a BACKEND of this organ, behind the same interface — not a permanent sibling."

# BINDING LAW (anchor-daemon lane): this crate NEVER depends on banchor.
# The wallet works fully with the anchor off — accelerator, never a gate.
# There is deliberately no `banchor` line in this manifest, and there never
# will be one while this law stands.
[dependencies]
ml-dsa = { version = "0.1", features = ["getrandom", "zeroize"] }
ml-kem = { version = "0.3", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = { workspace = true }
zeroize = { workspace = true }
thiserror = "2"
# bpq.rs (the Rust twin of surfaces/bpq.js): X-Wing's X25519 half, HKDF and
# AES-256-GCM for sealed objects, bech32m for the bzpq1 id.
aes-gcm = "0.10"
bech32 = "0.9"
hkdf = "0.12"
sha2 = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
