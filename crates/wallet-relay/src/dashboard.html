<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNR Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 1rem auto; color: #1a1a1a; }
    h1 { font-size: 1.5rem; margin-bottom: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .tile { border: 1px solid #e0e0e0; border-radius: 8px; padding: 1rem 1.25rem; }
    .tile h2 { font-size: 1rem; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 0.5rem; }
    .full { grid-column: 1 / -1; }
    button { background: #4a9eff; color: white; border: none; padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    button:disabled { background: #999; }
    button:hover:not(:disabled) { background: #3a8eef; }
    pre { background: #f5f5f5; padding: 0.5rem; border-radius: 4px; font-size: 0.8rem; overflow-x: auto; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    .green { color: #2e7d32; } .red { color: #c62828; }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.65rem; font-weight: 600; background: #fff3cd; color: #856404; }
    .note { font-size: 0.75rem; color: #666; }
    input { padding: 0.25rem; font-size: 0.85rem; border: 1px solid #ddd; border-radius: 3px; }
    .rail-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
    .rail-row label { width: 50px; font-weight: 600; font-size: 0.8rem; }
    .rail-row input { flex: 1; }
    table { width: 100%; font-size: 0.85rem; }
    td { padding: 0.2rem 0.4rem; }
    td:first-child { color: #666; width: 100px; }
  </style>
</head>
<body>
  <h1>Beehive Nature Reserve</h1>
  <p class="note">Sovereign relay &mdash; same-origin, no CORS</p>

  <div class="grid">
    <div class="tile">
      <h2>Relay Health</h2>
      <div id="health">Loading...</div>
    </div>

    <div class="tile">
      <h2>Mesh Presence <span class="badge">D7</span></h2>
      <div id="heartbeat">Loading...</div>
    </div>

    <div class="tile full">
      <h2>Wallet Balances</h2>
      <div class="rail-row">
        <label>AR</label>
        <input id="ar-addr" placeholder="Arweave address (43 chars)">
        <button onclick="checkBalance('arweave','ar-addr')">Check</button>
      </div>
      <div class="rail-row">
        <label>XLM</label>
        <input id="xlm-addr" placeholder="Stellar address (G...)">
        <button onclick="checkBalance('stellar','xlm-addr')">Check</button>
      </div>
      <div class="rail-row">
        <label>SOL</label>
        <input id="sol-addr" placeholder="Solana address">
        <button onclick="checkBalance('solana','sol-addr')">Check</button>
      </div>
      <div class="rail-row">
        <label>HIVE</label>
        <input id="hive-addr" placeholder="Hive account name">
        <button onclick="checkBalance('hive','hive-addr')">Check</button>
      </div>
      <div class="rail-row">
        <label>VAULTA</label>
        <input id="vlt-addr" placeholder="Antelope account (1-12 chars)">
        <button onclick="checkBalance('vaulta','vlt-addr')">Check</button>
      </div>
      <div id="balance-result" style="margin-top:0.5rem"></div>
    </div>

    <div class="tile">
      <h2>bStore <span class="badge">T-S</span></h2>
      <p class="note">MVP: Turbo free tier (shed-able bootstrap). Durable: self-hosted ar-io-node.</p>
      <button id="upload-btn" onclick="doUpload()">Sign and Upload</button>
      <div id="upload-result" style="margin-top:0.5rem"></div>
    </div>

    <div class="tile">
      <h2>Transaction Status</h2>
      <input id="tx-id" placeholder="tx id" style="width:100%;margin-bottom:0.3rem">
      <button onclick="checkStatus()">Check Status</button>
      <div id="status-result" style="margin-top:0.5rem"></div>
    </div>
  </div>

<script>
async function loadHealth() {
  try {
    const r = await fetch('/healthz'); const d = await r.json();
    let h = '<table>';
    d.gateways.forEach(g => {
      h += '<tr><td><span class="' + (g.degraded ? 'red' : 'green') + '">' + (g.degraded ? 'degraded' : 'ok') + '</span></td><td>' + g.gateway + '</td></tr>';
    });
    h += '<tr><td>Forward</td><td>' + (d.forward_configured ? 'configured' : 'none') + '</td></tr>';
    h += '</table>';
    document.getElementById('health').innerHTML = h;
  } catch(e) { document.getElementById('health').innerHTML = '<span class="red">Error</span>'; }
}

async function loadHeartbeat() {
  try {
    const r = await fetch('/v1/mesh/heartbeat'); const d = await r.json();
    let h = '<table>';
    h += '<tr><td>Node</td><td>' + d.node_id + '</td></tr>';
    h += '<tr><td>Status</td><td><span class="' + (d.status === 'ready' ? 'green' : '') + '">' + d.status + '</span></td></tr>';
    h += '<tr><td>Best Fit</td><td>' + d.model_name + '</td></tr>';
    h += '<tr><td>Score</td><td>' + d.fit_score.toFixed(2) + '</td></tr>';
    h += '<tr><td>HW</td><td>' + d.hardware.cpu_cores + 'c / ' + d.hardware.ram_gb + 'GB / GPU: ' + d.hardware.gpu + '</td></tr>';
    h += '<tr><td>b-metered</td><td>' + d.b_metered_tokens_this_epoch + ' tok</td></tr>';
    h += '</table>';
    document.getElementById('heartbeat').innerHTML = h;
  } catch(e) { document.getElementById('heartbeat').innerHTML = '<span class="red">Error</span>'; }
}

async function checkBalance(rail, inputId) {
  const addr = document.getElementById(inputId).value.trim();
  if (!addr) return;
  document.getElementById('balance-result').innerHTML = '<span class="note">Checking ' + rail + '...</span>';
  try {
    const r = await fetch('/v1/' + rail + '/balance/' + encodeURIComponent(addr));
    const d = await r.json();
    let label = rail.toUpperCase();
    let val = '';
    if (rail === 'arweave') val = d.balance_ar ? d.balance_ar + ' AR' : JSON.stringify(d);
    else if (rail === 'stellar') val = d.native_xlm ? d.native_xlm + ' XLM' : JSON.stringify(d);
    else if (rail === 'solana') val = d.balance_sol ? d.balance_sol + ' SOL' : JSON.stringify(d);
    else if (rail === 'hive') val = d.hive_power + ' HP, ' + d.rc_mana_pct + '% RC';
    else if (rail === 'vaulta') val = d.liquid_balance + ', CPU:' + d.cpu_available;
    let html = '<p><strong>' + label + ':</strong> ' + val + ' <span class="note">via ' + (d.gateway_used || '?') + ' [' + (d.tier || '?') + ']</span></p>';
    html += '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    document.getElementById('balance-result').innerHTML = html;
  } catch(e) { document.getElementById('balance-result').innerHTML = '<span class="red">Error: ' + e + '</span>'; }
}

async function doUpload() {
  const btn = document.getElementById('upload-btn');
  btn.disabled = true; btn.textContent = 'Uploading...';
  try {
    const r = await fetch('/v1/test-upload', { method: 'POST' }); const d = await r.json();
    let html = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    if (d.forwarded && d.id) {
      html += '<p class="green">TX: <code>' + d.id + '</code></p>';
      document.getElementById('tx-id').value = d.id;
    } else if (d.refused) { html += '<p class="red">Refused: ' + d.refused + '</p>'; }
    document.getElementById('upload-result').innerHTML = html;
  } catch(e) { document.getElementById('upload-result').innerHTML = '<span class="red">Error</span>'; }
  btn.disabled = false; btn.textContent = 'Sign and Upload';
}

async function checkStatus() {
  const id = document.getElementById('tx-id').value.trim(); if (!id) return;
  document.getElementById('status-result').innerHTML = '<span class="note">Checking...</span>';
  try {
    const r = await fetch('/v1/arweave/status/' + id); const d = await r.json();
    let html = '';
    if (d.found && d.confirmed) html += '<p class="green">Confirmed on Arweave!</p>';
    else if (d.found) html += '<p>Pending (accepted, not yet mined).</p>';
    else html += '<p class="red">Not found.</p>';
    html += '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
    document.getElementById('status-result').innerHTML = html;
  } catch(e) { document.getElementById('status-result').innerHTML = '<span class="red">Error</span>'; }
}

loadHealth(); loadHeartbeat();
setInterval(loadHealth, 30000); setInterval(loadHeartbeat, 30000);
</script>
</body>
</html>
