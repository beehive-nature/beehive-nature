[package]
name = "bnr-seal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Private storage envelope for already-signed receipt bytes: one allowlisted AEAD suite (XChaCha20-Poly1305), versioned header, opaque scope bound as associated data"

[dependencies]
# The same AEAD crate, major version and primitive (XChaCha20-Poly1305, random
# 24-byte nonces) x0x uses for encrypted KV records: x0x a42b5d9,
# src/groups/kv_context.rs, GssKvSecureContext::seal_snapshot and its open.
# Key derivation and AAD format were not compared: UNVERIFIED as equivalent.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
zeroize = { workspace = true, features = ["alloc"] }
