[package]
name = "bindexer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SPEC-BINDEXER-0: read-only chain indexer (Rust + SQLite), blockbook prior art, keyless by construction"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
