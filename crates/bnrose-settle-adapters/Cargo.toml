[package]
name = "bnrose-settle-adapters"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-only"
description = "BNROSE-ADAPTERS-REAL: the settlement adapters for the partition harness — Hive and EVM rails whose transaction ids are recomputed from canonical bytes, whose inclusion and finality come from each chain's own markers (never the test destination's model), and whose read paths are key-free by construction. Live-wire fault injection sits on the rail's real HTTP connection."
publish = false

[dependencies]
bnr-keys = { path = "../bnr-keys" }
bnrose-exec-core = { path = "../bnrose-exec-core" }
bnrose-exec-host = { path = "../bnrose-exec-host" }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
ureq = "2"

[lib]
name = "bnrose_settle_adapters"

[[bin]]
name = "bnrose-dest-arb"
path = "src/bin/bnrose-dest-arb.rs"

[[bin]]
name = "bnrose-dest-hive"
path = "src/bin/bnrose-dest-hive.rs"

[[bin]]
name = "bnrose-rail-host"
path = "src/bin/bnrose-rail-host.rs"

[[bin]]
name = "bnrose-adapter-probe"
path = "src/bin/bnrose-adapter-probe.rs"
