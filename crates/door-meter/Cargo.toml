[package]
name = "door-meter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Metered gate for the llama-pool door: per-key byte accounting into bMeter records (fail-closed), settled in bPay. Replaces the flat POOL_KEY gate; the door stays a replaceable adapter."

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
