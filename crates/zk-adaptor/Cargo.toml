[package]
name = "zk-adaptor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "zkAdaptor: cryptographic proof shapes behind one adaptor trait, scored on the estate scoreboard (proof bytes, verifier cost, prover time, setup, PQ resistance). Native plane: Schnorr/bzDiD + ML-DSA; interop seam: Poseidon-committed foreign shapes, verified never trusted."

[dependencies]
bsigner = { path = "../bsigner" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = { workspace = true }
sha2 = { workspace = true }
k256 = { version = "0.13", features = ["schnorr"] }
getrandom = "0.2"
