[package]
name = "bpay-rail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OFFLINE SKELETON of the unified bPay rail trait: one lifecycle ledger + fee descriptor + the law stack, with the EVM/watchpay engine as the first concrete member and LN (NWC-shaped, MOCK client) as the second adapter contract. x402 stays the EVM first-line door at the design level. No network, no node, no deployment — the R10 adversarial harness runs synthetic probes only."

[dependencies]
watchpay = { path = "../watchpay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"

