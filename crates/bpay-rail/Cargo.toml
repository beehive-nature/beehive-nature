[package]
name = "bpay-rail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OFFLINE SKELETON of the unified bPay rail trait: one lifecycle ledger + fee descriptor + the law stack, with the EVM/watchpay engine as the first concrete member and LN (NWC-shaped) as the second adapter contract. NIP-44 crypto + the kind-23195 response-correlation engine are pure modules in the DEFAULT build (network-free); the live-nwc feature adds the WebSocket transport (tungstenite) — no REST shortcuts, Nostr subscription semantics only."

[dependencies]
watchpay = { path = "../watchpay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdh", "schnorr", "alloc", "arithmetic"] }
chacha20 = { version = "0.9", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
getrandom = "0.2"
zeroize = { workspace = true }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"], optional = true }

[dev-dependencies]
hex = "0.4"

[features]
default = []
live-nwc = ["dep:tungstenite"]
