[package]
name = "bpay-rail"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OFFLINE SKELETON of the unified bPay rail trait: one lifecycle ledger + fee descriptor + the law stack, with the EVM/watchpay engine as the first concrete member and LN (NWC-shaped) as the second adapter contract. The live-nwc feature adds the LIVE NIP-47 transport (nostr events, NIP-44 v2, relay POST) — default builds stay mock-only and network-free."

[dependencies]
watchpay = { path = "../watchpay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = { version = "0.10", optional = true }
k256 = { version = "0.13", default-features = false, features = ["ecdh", "schnorr", "alloc", "arithmetic"], optional = true }
chacha20 = { version = "0.9", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[dev-dependencies]
hex = "0.4"

[features]
default = []
live-nwc = ["dep:sha2", "dep:k256", "dep:chacha20", "dep:hmac", "dep:hkdf", "dep:ureq"]
